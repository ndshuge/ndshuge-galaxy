<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050514">
<title>鼠哥艺术回廊 · NDSHUGE ART ARCADE</title>
<meta name="description" content="环形回廊，六件作品挂在环上，你站在圆心。左右换作品，点进去就走进那件作品里。">
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/570/main/result.css" />
<style>
:root{--bg:#050514;--pink:#ff5c8a;--pink2:#ff9ec4;--gold:#ffd54f;--cyan:#00e5ff;--ink:#eafcff;--dim:rgba(150,215,255,.55)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:"Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace;
     color:#bfefff;user-select:none;-webkit-user-select:none;
     background:linear-gradient(#0a0616,#03040e)}
#space{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
       image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none}
#crt{position:fixed;inset:0;z-index:6;pointer-events:none;
     background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
#brand{position:fixed;top:12px;left:16px;z-index:5;font-size:12px;letter-spacing:1px;color:var(--dim);pointer-events:none}
#brand b{color:var(--pink);font-weight:normal}
#sysbar{position:fixed;top:12px;right:16px;z-index:5;display:flex;gap:8px;align-items:center}
.gh{font-size:12px;letter-spacing:1px;color:var(--cyan);text-decoration:none;
  border:1px solid rgba(0,229,255,.4);padding:5px 10px;background:rgba(4,8,24,.7)}
.gh:active{background:rgba(0,229,255,.16)}
#snd{font-size:12px;letter-spacing:1px;color:var(--cyan);border:1px solid rgba(0,229,255,.4);
  padding:5px 10px;background:rgba(4,8,24,.7);cursor:pointer}
/* 编号 / 标题 / 说明 / 进入 / 点赞全部画进 canvas，DOM 只剩品牌条、返回与音效开关 */
#hint{position:fixed;top:44px;left:0;right:0;z-index:5;
  font-size:12px;letter-spacing:1px;color:rgba(120,190,230,.4);text-align:center;pointer-events:none}
body.warping #brand,body.warping #sysbar,body.warping #hint{opacity:0}
#brand,#sysbar,#hint{transition:opacity .3s}
#boot{position:fixed;inset:0;z-index:50;background:#06040f;pointer-events:none;
  animation:bootin 1.4s ease-in .3s forwards}
@keyframes bootin{to{opacity:0}}
@media (orientation:portrait) and (max-width:820px){
  #space{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 7%,#000 93%,transparent);
         mask-image:linear-gradient(to bottom,transparent,#000 7%,#000 93%,transparent)}
  #hint{font-size:11px;top:40px}
}
@media (prefers-reduced-motion:reduce){#boot{animation-duration:.3s}}
</style>
</head>
<body>
<div id="boot"></div>
<canvas id="space" width="480" height="270"></canvas>
<div id="crt"></div>
<div id="brand">◆ NDSHUGE <b>艺术回廊</b> · ART ARCADE</div>
<div id="sysbar">
  <a class="gh" href="../" id="backGalaxy">&larr; 星系</a>
  <a class="gh" href="https://github.com/ndshuge/ndshuge-galaxy" target="_blank" rel="noopener">GITHUB</a>
  <span id="snd" role="button" tabindex="0">[M] &#9834;ON</span>
</div>
<div id="hint">&larr; &rarr; 换作品 · 点画框走进它 · 拖动转圈 · 你站在圆心</div>

<script>
'use strict';
window.addEventListener('error',function(ev){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;top:70px;left:8px;right:8px;z-index:99;background:#4a0d16;color:#ffd7d7;font:12px monospace;padding:8px;white-space:pre-wrap;border:1px solid #a33';
  d.textContent='页面脚本出错：'+ev.message+'（第'+ev.lineno+'行）——把这行字告诉拉里';
  document.body.appendChild(d);});

/* ============ 配置区 ============
   每一件 = 一个挂在环上的画框。motif 是画框里那张「牌位」的编号，
   每个牌位都用程序化像素画现画，不摆任何假的页面截图。
   想增删作品，直接增删数组项；STEP 会自动按件数分配角度。 */
var WORKS=[
  { no:'01', t:'环廊',     en:'ROTUNDA',      sub:'十二帧',   medium:'线上摄影装置', year:'2026',
    line:'十二帧悬在一个看不见的环上，你站在圆心。',
    href:'../rotunda/', c:'#ff5c8a', g:'#ff9ec4', like:'art-rotunda', motif:'twelve' },
  { no:'02', t:'经纬 · 线场', en:'FIELD LINES',  sub:'五种规则', medium:'交互图版', year:'2026', fresh:true,
    line:'横的线、竖的线、绕起来的线，各走各的规则。',
    href:'./linefield/', c:'#00e5ff', g:'#9ff0ff', like:'art-linefield', motif:'lines' },
  { no:'03', t:'珂斯兰铜版勘测', en:'KOSLAN',     sub:'蚀刻图',  medium:'铜版勘测图', year:'2026',
    line:'滚轮推拉尺度，拖拽平移，一枚探针跟着光标读数。',
    href:'./koslan/', c:'#da6a3c', g:'#ffbe9e', like:'art-koslan', motif:'survey' },
  { no:'04', t:'墨 · 动效剧场', en:'INK MOTION',  sub:'交互宣言', medium:'水墨动效', year:'2026',
    line:'墨场、字重、装置走廊，每个动点都有话说。',
    href:'./ink-motion/', c:'#e7e0cf', g:'#fff8e8', like:'art-inkmotion', motif:'ink' },
  { no:'05', t:'深渊观测站', en:'ABYSS',      sub:'下潜',     medium:'观测装置', year:'2026',
    line:'从水面到 2640 米，ROV-04 沿 214° 测线下潜，直到某个回波回来。',
    href:'./abyss/', c:'#4fc3ff', g:'#a8e3ff', like:'art-abyss', motif:'abyss' },
  { no:'06', t:'苔痕',   en:'VERDIGRIS',  sub:'生长与退边', medium:'生态装置', year:'2026', fresh:true,
    line:'石面上的一场生长：降水就长，干季就退，从来没有一幅苔是长完的。',
    href:'./verdigris/', c:'#8fb894', g:'#c8dcc6', like:'art-verdigris', motif:'patina' },
  { no:'07', t:'声场',   en:'CHLADNI',    sub:'驻波图形', medium:'声学装置', year:'2026', fresh:true,
    line:'压上弓，撒一层沙，看它自己走到该站的地方。',
    href:'./chladni/', c:'#a78bfa', g:'#d9c6ff', like:'art-chladni', motif:'chladni' }
];
var N=WORKS.length, STEP=Math.PI*2/N;
var CN=['零','一','二','三','四','五','六','七','八','九','十'];   /* 件数写中文，加作品时不用改文案 */

/* ============ 引擎 ============ */
var W=480,H=270,TAU=Math.PI*2;
var RX=240,RY=126,RXR=136,RYR=46;        /* 环心与环半径：画框挂在这条环上 */
var FLY=198;                              /* 地平线：脚下的地面从这里铺开 */
var REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
var IS_TOUCH=matchMedia('(pointer:coarse)').matches;
var cv=document.getElementById('space'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,k){return a+(b-a)*k;}
function shade(hex,f){var n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
  if(f>=0){r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}else{r*=1+f;g*=1+f;b*=1+f}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function hexA(hex,a){var n=parseInt(hex.slice(1),16);
  return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function fit(){
  /* 整幅 480x270 必须可见：牌位块画在画布底部，不能裁 */
  var s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=Math.ceil(W*s)+'px';cv.style.height=Math.ceil(H*s)+'px';}
addEventListener('resize',fit);fit();

/* ---------- 像素画笔：只用 1px 方块，不用任何抗锯齿路径 ---------- */
function px(x,y,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,1,1);}
function pbar(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));}
function pdotLine(x0,y0,x1,y1,c,step){
  var dx=x1-x0,dy=y1-y0,d=Math.sqrt(dx*dx+dy*dy),n=Math.max(1,Math.round(d/step));
  ctx.fillStyle=c;
  for(var i=0;i<=n;i++){var k=i/n;ctx.fillRect(Math.round(x0+dx*k),Math.round(y0+dy*k),1,1);}
}
function pEllipse(cx,cy,rx,ry,c,step,from,to){
  var a0=(from===undefined?0:from),a1=(to===undefined?TAU:to);
  var n=Math.max(8,Math.round(((a1-a0)*Math.max(rx,ry))/step));
  ctx.fillStyle=c;
  for(var i=0;i<=n;i++){var a=a0+(a1-a0)*i/n;
    ctx.fillRect(Math.round(cx+Math.cos(a)*rx),Math.round(cy+Math.sin(a)*ry),1,1);}
}
/* 一个实心圆盘（画牌位里的墨点用） */
function pDisc(cx,cy,r,c){
  ctx.fillStyle=c;
  for(var y=-Math.ceil(r);y<=Math.ceil(r);y++){
    var w=Math.floor(Math.sqrt(Math.max(0,r*r-y*y)));
    if(w>=0)ctx.fillRect(Math.round(cx)-w,Math.round(cy)+y,2*w+1,1);}
}
function pBox(x,y,w,h,fill,edge){
  pbar(x,y,w,h,fill);
  if(edge){pbar(x,y,w,1,edge);pbar(x,y+h-1,w,1,edge);pbar(x,y,1,h,edge);pbar(x+w-1,y,1,h,edge);}
}
/* 逐字测量换行；最多 maxLines 行，溢出补省略号 */
function wrapText(str,maxW,maxLines,font){
  ctx.font=font;var all=[],cur='';
  for(var i=0;i<str.length;i++){
    var ch=str.charAt(i);
    if(cur&&ctx.measureText(cur+ch).width>maxW){all.push(cur);cur='';}
    cur+=ch;}
  if(cur)all.push(cur);
  if(all.length>maxLines){
    all=all.slice(0,maxLines);
    var last=all[maxLines-1];
    while(last.length&&ctx.measureText(last+'\u2026').width>maxW)last=last.slice(0,-1);
    all[maxLines-1]=last+'\u2026';}
  return all;
}
var FB='12px "Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace';
var FB14='14px "Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace';
var FB16='16px "Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace';
var FB10='10px "Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace';

/* ---------- 音效（方波，与游戏厅同一套手法） ---------- */
var actx=null,master=null,muted=false;
function audio(){if(actx)return;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=muted?0:1;master.connect(actx.destination);}catch(e){}}
function tone(type,f0,f1,dur,peak,delay){if(!actx||muted)return;
  var t=actx.currentTime+(delay||0);
  var o=actx.createOscillator(),g=actx.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function sndSelect(){tone('square',520,760,.06,.045);}
function sndLike(){tone('square',880,1320,.09,.08);tone('square',1320,1760,.07,.05,.06);}
/* 进画的声音：三个音往上浮，尾巴长，不用游戏厅那种短促跳音 */
function sndEnter(){tone('triangle',392,392,.55,.05);tone('triangle',523.25,523.25,.6,.045,.13);
tone('triangle',659.25,659.25,.8,.04,.26);tone('sine',1318.5,1318.5,.5,.02,.34);}
function sndBack(){tone('square',600,240,.14,.05);}

/* ---------- 动态壁纸：星尘 + 中央吊灯 ---------- */
var dust=[],stars=[];
for(var i=0;i<54;i++)dust.push({x:rnd(0,W),y:rnd(20,FLY),s:1,par:rnd(.3,1),ph:rnd(0,TAU)});
for(var j=0;j<46;j++)stars.push({x:rnd(0,W),y:rnd(0,H),s:1,par:rnd(.1,.5),ph:rnd(0,TAU)});

/* 静止底板只画一次：地面、天花环、后排廊柱 */
var bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function paintBG(){
  var g=bg.getContext('2d'),saved=ctx;
  ctx=g;
  /* -- 天花：一条横带，馆名写在里面；下沿两道线把墙分开 -- */
  for(var yy=0;yy<62;yy++){
    var kk=yy/62;
    pbar(0,yy,W,1,'rgb('+Math.round(5+kk*4)+','+Math.round(5+kk*5)+','+Math.round(17+kk*9)+')');}
  pdotLine(0,62,W,62,'rgba(140,190,255,.20)',2);
  pdotLine(0,65,W,65,'rgba(140,190,255,.09)',2);
  /* -- 墙与地交界的那道环，回廊的顶 -- */
  pEllipse(240,RY,172,62,'rgba(150,200,255,.13)',1.7);
  /* -- 地面：只在岸线以下画，绝不到墙上去 -- */
  ctx.save();
  ctx.beginPath();ctx.rect(0,FLY-26,W,H-(FLY-26));ctx.clip();
  for(var y=FLY-26;y<H;y++){
    var dy=(y-(FLY-26))/26;
    var half=Math.round(46+dy*250);
    pbar(240-half,y,half*2,1,'rgb('+Math.round(7+dy*6)+','+Math.round(11+dy*8)+','+Math.round(28+dy*14)+')');}
  pEllipse(240,RY,RXR+26,RYR+30,'rgba(120,180,255,.10)',2.2);
  pEllipse(240,RY,RXR+10,RYR+16,'rgba(120,180,255,.07)',2.4);
  for(var k=0;k<26;k++){                       /* 地面辐射线 */
    var a=k/26*TAU,s=Math.sin(a),c=Math.cos(a);
    var x0=240+c*(RXR+12),y0=RY+s*(RYR+14);
    var x1=240+c*(RXR+52),y1=RY+s*(RYR+56);
    if(y1>FLY-24)pdotLine(x0,y0,x1,y1,'rgba(110,170,240,.10)',2.5);}
  ctx.restore();
  /* -- 台口地面上的两道横线，给“站在圆心”一个底 -- */
  pdotLine(120,FLY,360,FLY,'rgba(140,190,255,.16)',2);
  ctx=saved;
})();

/* 后排廊柱：以前画在静态底板上，于是永远压在画框上面（这就是穿模）。
   现在它们和画框进同一张深度表，按远近排着画。 */
var PILLARS=(function(){
  var out=[];
  for(var m=0;m<7;m++){
    var th=(190+m*(160/6))*Math.PI/180;
    var s=0.62+0.38*Math.sin(th);
    out.push({th:th,s:s,d:Math.sin(th),
      x:240+Math.cos(th)*(RXR+18),
      ph:Math.round(24+38*s),pw:s>0.75?3:2,
      floorY:RY+(RYR+40)*Math.max(0.2,Math.sin(th))});
  }
  return out;})();
/* 声场牌位：驻波节线上的沙点。位形先算一次（2,4 模态），画的时候按比例贴上去 */
var NODAL=(function(){
  var out=[],m=2,n=4,GW=26,GH=22;
  for(var j=0;j<GH;j++)for(var i=0;i<GW;i++){
    var x=(i+0.5)/GW,y=(j+0.5)/GH;
    var u=Math.cos(n*Math.PI*x)*Math.cos(m*Math.PI*y)-Math.cos(m*Math.PI*x)*Math.cos(n*Math.PI*y);
    if(Math.abs(u)<0.16)out.push([(i+0.5)/GW,(j+0.5)/GH]);
  }
  return out;})();
function drawPillar(idx){
  var p=PILLARS[idx],x=p.x-p.pw/2,y=p.floorY-p.ph;
  pbar(x,y,p.pw,p.ph,'#141c33');
  pbar(x,y,p.pw,1,'rgba(180,215,255,.35)');
  pbar(x,y,p.pw,2,'#1d2a4a');
  pbar(x,RY,1,Math.max(2,p.floorY-RY-p.ph),'rgba(255,255,255,.05)');
}

/* ---------- 牌位（画框里那张画）：全部程序化，无外部资源 ---------- */
function motifIndex(name){for(var i=0;i<WORKS.length;i++)if(WORKS[i].motif===name)return i;return 0;}

function drawMotif(name,x,y,w,h,t,wc,wg){
  ctx.save();
  ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  var i,j,cx=x+w/2,cy=y+h/2;
  if(name==='twelve'){
    /* 环廊：十二帧挂在看不见的环上，一帧一帧亮过去 */
    pbar(x,y,w,h,'#0b0a14');
    var rx=w*0.36,ry=h*0.34,lit=Math.floor(t*1.6)%12;
    pEllipse(cx,cy,rx,ry,'rgba(255,158,196,.20)',1.6);
    for(i=0;i<12;i++){
      var a=i/12*TAU-Math.PI/2;
      var fx=cx+Math.cos(a)*rx,fy=cy+Math.sin(a)*ry;
      var on=i===lit;
      pBox(Math.round(fx)-2,Math.round(fy)-2,5,5,on?'#2a1020':'#151022',on?wc:'rgba(255,158,196,.28)');
      if(on){pbar(Math.round(fx)-1,Math.round(fy)-1,3,3,wc);px(Math.round(fx),Math.round(fy),'#ffffff');
        ctx.fillStyle='rgba(255,92,138,.10)';ctx.fillRect(x,y,w,h);}
    }
    px(cx,cy,'rgba(234,252,255,.55)');px(cx-1,cy,'rgba(234,252,255,.3)');px(cx+1,cy,'rgba(234,252,255,.3)');
  } else if(name==='lines'){
    /* 线场：五种规则各占一条带，互不加戏 */
    pbar(x,y,w,h,'#06080f');
    var bands=5,bh=h/bands;
    for(i=0;i<bands;i++){
      var by=y+i*bh,mid=by+bh/2;
      if(i===0){                                   /* 灯丝：竖线随呼吸摆 */
        for(j=0;j<11;j++){var fx2=x+3+j*(w-6)/10;
          var sw=Math.sin(t*1.4+j*.6)*1.4,hh=bh*.34+Math.sin(t*2+j)*bh*.07;
          pbar(fx2+sw,mid-hh,1,hh*2,'rgba(0,229,255,.55)');}
      } else if(i===1){                            /* 摆波：相位逐点延迟 */
        for(j=0;j<w-4;j++){var py=mid+Math.sin(j*.28-t*2.2)*bh*.28;
          px(x+2+j,py,'rgba(159,240,255,.75)');}
      } else if(i===2){                            /* 摩尔纹：两个错开的圆 */
        pEllipse(cx-3,mid,bh*.34,bh*.34,'rgba(0,229,255,.45)',1.2);
        pEllipse(cx+3,mid,bh*.34,bh*.34,'rgba(159,240,255,.35)',1.2);
      } else if(i===3){                            /* 谐波仪：李萨如轨迹 */
        for(j=0;j<40;j++){var tt=j/40*TAU+t*.5;
          px(cx+Math.sin(3*tt)*bh*.42, mid+Math.sin(2*tt)*bh*.3,'rgba(0,229,255,.6)');}
      } else {                                      /* 排版场：长短不一的字排 */
        for(j=0;j<5;j++){
          var lw=(w-10)*(0.3+0.55*Math.abs(Math.sin(j*1.7+t*.7)));
          pbar(x+5,by+2+j*(bh-4)/5,lw,1,'rgba(159,240,255,.5)');}
      }
      if(i) pdotLine(x+2,by,x+w-2,by,'rgba(120,190,230,.18)',2);
    }
  } else if(name==='survey'){
    /* 珂斯兰：等高线 + 水系 + 路网，探针赭石 */
    pbar(x,y,w,h,'#0a0c11');
    for(i=0;i<4;i++){
      var rr=Math.max(2.5,(w*.14)+i*w*.075),wob=1+Math.sin(t*.7+i)*.05;
      pEllipse(cx-1,cy+1,rr*wob,rr*.62*wob,'rgba(198,209,224,'+(0.34-i*0.06).toFixed(2)+')',1.5);
    }
    for(j=0;j<w-6;j++){var wy=cy+Math.sin(j*.22+t*.5)*1.6;
      px(x+3+j,wy,'rgba(44,130,174,.85)');px(x+3+j,wy+1,'rgba(140,188,218,.4)');}
    for(i=0;i<3;i++){var bx=x+6+i*(w-12)/2.4,by2=y+4+i*4;

function easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function smoothStep(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function angOf(i){return Math.PI/2+i*STEP+rot;}
function depthOf(i){return Math.sin(angOf(i));}
function scaleOf(d){return 0.60+0.40*Math.max(0,d);}
function ringPos(i){
  var a=angOf(i),d=Math.max(0,Math.sin(a));
  return { x:240+Math.cos(a)*RXR, y:RY+Math.sin(a)*RYR, d:d, s:scaleOf(d) };
}

function drawOpenInk(t){
  var k=trans.k,p=clamp((k-0.30)/0.52,0,1);
  if(p<=0)return;
  var w=WORKS[trans.i],e=smoothStep(p);
  var flood=shade(w.c,-0.74);                 /* 整间屋子沉进作品那支色里 */
  var holeH=lerp(1.06,0,e),holeW=lerp(1.15,0,e),jit=(1-e)*1.1;
  var cy=135,cx=240;
  for(var y=0;y<H;y++){
    var dy=Math.abs(y-cy),hy=holeH*H/2;
    var wob=(Math.sin(y*.31+k*7)+Math.sin(y*.11+k*3))*jit;
    if(dy>hy+wob){pbar(0,y,W,1,flood);continue;}
    var t2=hy>0?dy/hy:1;
    var hw=Math.sqrt(Math.max(0,1-t2*t2))*holeW*W/2;
    if(hw<=0.5){pbar(0,y,W,1,flood);continue;}
    var l=Math.round(cx-hw),r=Math.round(cx+hw);
    pbar(0,y,l,1,flood);
    pbar(r,y,W-r,1,flood);
    pbar(Math.max(0,l-3),y,3,1,w.c);          /* 洇湿的边，亮一线 */
    pbar(r,y,Math.min(3,W-r),1,w.c);}
  for(var i=0;i<14;i++){                      /* 被带起来的墨屑 */
    var a=i/14*TAU+k*2.4;
    var rr=lerp(16,140,e)+Math.sin(k*9+i)*8;
    var qx=cx+Math.cos(a)*rr,qy=cy+Math.sin(a)*rr*.72;
    px(qx,qy,w.g);if(i%3===0)px(qx+1,qy,'rgba(255,255,255,.55)');}
}

  if(k<0.40)return;
  var w=WORKS[trans.i];
  var fin=clamp((k-0.40)/0.34,0,1),out=clamp((k-0.86)/0.14,0,1);
  var a=Math.min(1,fin*2.2)*(1-out),e=smoothStep(fin);
  var dy=(1-e)*10,sp=3+14*e;
  ctx.globalAlpha=a;ctx.textAlign='center';
  ctx.font=FB10;ctx.fillStyle=w.g;
  ctx.fillText(w.no,240,96+dy);
  var fs=Math.round(18+9*(1+0.75*e));
  ctx.font=fs+'px "Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace';
  var s=w.t,i,total=0,ws=[];
  for(i=0;i<s.length;i++){ws.push(ctx.measureText(s.charAt(i)).width);total+=ws[i]+sp;}
  total-=sp;
  var x=240-total/2;
  for(i=0;i<s.length;i++){
    var yy=126+dy+Math.sin(e*3+i*0.7)*1.6*(1-out);
    ctx.fillStyle='rgba(0,0,0,.42)';ctx.fillText(s.charAt(i),x+ws[i]/2+1,yy+1);
    ctx.fillStyle=w.g;ctx.fillText(s.charAt(i),x+ws[i]/2,yy);
    x+=ws[i]+sp;}
  ctx.font=FB10;ctx.fillStyle='rgba(255,255,255,'+(0.6*(1-out)).toFixed(2)+')';
  ctx.fillText(w.en+(w.sub?' · '+w.sub:''),240,146+dy);
  ctx.globalAlpha=1;ctx.textAlign='left';
}
function drawWarpFlash(){
  /* 已废：旧的「放大 + 白闪」跃迁换成了开画转场（drawOpenInk / drawTitleCard），
     这里只留空壳，避免别处还有调用点没改。 */
}
var drawOrder=[];               /* 本帧的绘制深度顺序，自检拿它验穿模 */
var lastRects=[];               /* 本帧每个画框的屏幕矩形，自检拿它验相邻不叠 */
var lastPlate=null;             /* 牌位上那行说明的位置与宽度，自检拿它验不挡入口 */
function render(t){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#05040f';ctx.fillRect(0,0,W,H);
  ctx.drawImage(bg,0,0);
  drawDust(t);
  drawGlow(t);
  drawBackWall(t);
  /* 廊柱与画框同一张深度表：远的先画，谁也不压在谁身上 */
  hot.frame=[];
  lastRects=[];
  var items=[],i;
  for(i=0;i<PILLARS.length;i++)items.push({d:PILLARS[i].d,i:i,kind:'p'});
  for(i=0;i<N;i++)items.push({d:depthOf(i),i:i,kind:'f'});
  items.sort(function(a,b){return a.d-b.d;});
  drawOrder=[];
  for(i=0;i<items.length;i++){
    var it=items[i];drawOrder.push(it.d);
    if(it.kind==='p')drawPillar(it.i);else drawFrame(it.i,t);}
  if(trans.active)drawOpenInk(t);
  drawPlate(t);
  drawHUD(t);
  if(trans.active)drawTitleCard(t);
}

/* ---------- 循环 ---------- */
var last=0;
function loop(ts){
  var t=ts/1000;
  var dt=Math.min(0.05,last?t-last:1/60);last=t;
  if(trans.active){
    trans.k+=dt/trans.dur;
    rot+=dt*STEP*0.16;                        /* 环保慢慢漂，不是甩出去 */
    rotV*=Math.max(0,1-dt*6);
    if(trans.k>=1&&!trans.done){trans.done=true;
      location.href=WORKS[trans.i].href;return;}
  } else {
    /* 带质量的弹簧：轻微过冲再回正，拖动与吸附都变丝滑 */
    var acc=(rotT-rot)*34-rotV*9;
    rotV+=acc*dt;rot+=rotV*dt;
    if(Math.abs(rotT-rot)<0.0015&&Math.abs(rotV)<0.02){rot=rotT;rotV=0;}
  }
  render(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- 交互 ---------- */
function toGame(e){var r=cv.getBoundingClientRect();
  return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
function snapTo(i){
  /* 目标角取“离当前 rot 最近的那个等价角”：环上导航永远走最小路径 */
  var base=-i*STEP;
  rotT=base+Math.round((rot-base)/TAU)*TAU;
}
function select(i,quiet){
  i=((i%N)+N)%N;
  if(i===cur){if(!quiet)tone('square',700,700,.04,.03);return;}
  cur=i;snapTo(cur);
  likeOn[WORKS[cur].like]=(likeState(WORKS[cur].like)==='1');
  fetchLike(WORKS[cur].like);
  if(!quiet)sndSelect();
}
function enter(){
  if(trans.active)return;
  trans.active=true;trans.k=0;trans.i=cur;trans.done=false;
  trans.dur=REDUCED?0.30:1.35;
  rotV=0;
  document.body.classList.add('warping');
  sndEnter();
}
var drag=null;
cv.addEventListener('pointermove',function(e){
  var p=toGame(e);mouseX=p[0];mouseY=p[1];
  if(drag){var dx=p[0]-drag.x;
    rot=drag.rot-dx*0.010;rotT=rot;
    rotV=clamp(-dx*0.010*60,-5,5);              /* 松手后带着这股劲继续走 */
    var near=Math.round(-rot/STEP),wrapped=((near%N)+N)%N;
    if(wrapped!==cur)select(wrapped,true);
    drag.moved=drag.moved||Math.abs(p[0]-drag.x0)>6;}
});
cv.addEventListener('pointerdown',function(e){
  audio();
  var p=toGame(e);mouseX=p[0];mouseY=p[1];
  drag={x:p[0],rot:rot,x0:p[0],moved:false};
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointerup',function(e){
  var p=toGame(e);mouseX=p[0];mouseY=p[1];
  var wasDrag=drag&&drag.moved;drag=null;
  if(trans.active)return;
  if(wasDrag){                                    /* 惯性：甩得够快就再进一件 */
    if(Math.abs(rotV)>1.6)select(cur+(rotV>0?-1:1),true);
    else snapTo(cur);
    rotV=clamp(rotV,-3,3);
    return;}
  var i,fr=hot.frame;
  for(i=0;i<fr.length;i++){var f=fr[i];
    if(p[0]>=f.x-4&&p[0]<=f.x+f.w+4&&p[1]>=f.y-4&&p[1]<=f.y+f.h+4){
      if(f.i===cur)enter();else select(f.i);
      return;}}
  var en=hot.enter,lk=hot.like;
  if(en&&p[0]>=en.x&&p[0]<=en.x+en.w&&p[1]>=en.y&&p[1]<=en.y+en.h){enter();return;}
  if(lk&&p[0]>=lk.x&&p[0]<=lk.x+lk.w&&p[1]>=lk.y&&p[1]<=lk.y+lk.h){toggleLike(WORKS[cur].like);return;}
  if(!IS_TOUCH){ /* 桌面：点空白处前进一件，像翻页 */
    select(cur+1,true);}
});
cv.addEventListener('wheel',function(e){
  e.preventDefault();audio();
  select(cur+(e.deltaY>0?1:-1));
},{passive:false});
addEventListener('keydown',function(e){
  audio();
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){select(cur-1);}
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){select(cur+1);}
  else if(e.key==='Enter'||e.key===' '||e.key==='ArrowUp'||e.key==='w'){e.preventDefault();enter();}
  else if(e.key==='m'||e.key==='M'){setMute(!muted);}
  else if(/^[1-9]$/.test(e.key)){var n=parseInt(e.key,10)-1;if(n<N)select(n);}
});
document.getElementById('backGalaxy').addEventListener('click',function(){sndBack();});
var sndEl=document.getElementById('snd');
function setMute(m){muted=m;if(master)master.gain.value=m?0:1;
  sndEl.innerHTML=m?'[M] &#9834;OFF':'[M] &#9834;ON';
  sndEl.style.color=m?'rgba(120,190,230,.5)':'#00e5ff';
  if(!m)tone('square',880,1320,.07,.05);}
sndEl.addEventListener('click',function(){audio();setMute(!muted);});
sndEl.addEventListener('keydown',function(e){if(e.key==='Enter'){audio();setMute(!muted);}});
document.addEventListener('visibilitychange',function(){if(!document.hidden)last=0;});

/* 首屏：先亮一件，再让人自己转 */
likeOn[WORKS[cur].like]=(likeState(WORKS[cur].like)==='1');
fetchLike(WORKS[cur].like);
if(IS_TOUCH){var hint=document.getElementById('hint');
  hint.textContent='左右滑动换作品 · 点画框走进它';}
else{setTimeout(function(){hintShown=true;},5600);}

/* 自检钩子：node vm 里跑断言用，正常浏览不碰 */
window.__arc={
  n:function(){return N;},
  works:function(){return WORKS;},
  state:function(){return{cur:cur,rot:rot,rotT:rotT,warp:trans.active,k:trans.k,
    frames:hot.frame.length,enter:!!hot.enter,like:!!hot.like};},
  order:function(){return drawOrder.slice();},
  rects:function(){return lastRects.slice();},
  plate:function(){return lastPlate;},
  pillars:function(){return PILLARS.map(function(p){return p.d;});},
  step:function(i){select(i);},
  snap:function(i){select(i);rot=rotT;},        /* 测试用：瞬间转到正面，不等弹簧收敛 */
  enter:function(){enter();},
  tick:function(t){render(t||0);},
  ang:function(i){return angOf(i);},
  click:function(x,y){mouseX=x;mouseY=y;
    var ev={clientX:0,clientY:0};
    var r=cv.getBoundingClientRect();
    ev.clientX=r.left+x*r.width/W;ev.clientY=r.top+y*r.height/H;
    cv.dispatchEvent(new PointerEvent('pointerup',ev));}
};
</script>
</body>
