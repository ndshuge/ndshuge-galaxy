<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>行星仪 · ORRERY</title>
<style>:root{
  --ink:#e9e3d6;
  --ink-dim:#8d8577;
  --brass:#c9a86a;
  --brass-soft:rgba(201,168,106,.42);
  --line:rgba(201,168,106,.16);
  --bg:#07080b;
  --serif:"Optima","Palatino Linotype",Palatino,Georgia,"Songti SC","Source Han Serif SC",serif;
  --sans:"Inter","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#scene:active{cursor:grabbing}

.hud{position:fixed;inset:0;pointer-events:none;padding:clamp(18px,3.2vw,40px);display:flex;flex-direction:column;justify-content:space-between}
.hud>*{pointer-events:auto}

/* ---------- title ---------- */
.title{max-width:min(52ch,60vw)}
.title h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.6vw,44px);letter-spacing:.24em;line-height:1;color:var(--ink);text-shadow:0 0 28px rgba(201,168,106,.22)}
.title .sub{margin-top:10px;font-size:clamp(10px,1.05vw,12px);letter-spacing:.34em;text-transform:uppercase;color:var(--brass);opacity:.86}
.title .dot{margin:0 .55em;opacity:.6}

/* ---------- legend ---------- */
.legend{list-style:none;position:absolute;left:clamp(18px,3.2vw,40px);bottom:clamp(74px,9vh,96px);display:grid;gap:7px}
.legend li{display:grid;grid-template-columns:8px auto auto;align-items:baseline;gap:9px;font-size:11px;letter-spacing:.1em;opacity:0;transform:translateX(-8px);animation:slide .7s cubic-bezier(.22,1,.36,1) forwards}
.legend i{width:8px;height:8px;border-radius:50%;display:block;transform:translateY(-1px);box-shadow:0 0 10px currentColor}
.legend b{font-weight:500;color:var(--ink);min-width:3.1em}
.legend s{text-decoration:none;color:rgba(233,227,214,.44);font-variant-numeric:tabular-nums;font-size:10px}
.legend li:nth-child(1){animation-delay:.30s}
.legend li:nth-child(2){animation-delay:.38s}
.legend li:nth-child(3){animation-delay:.46s}
.legend li:nth-child(4){animation-delay:.54s}
.legend li:nth-child(5){animation-delay:.62s}
@keyframes slide{to{opacity:1;transform:none}}

/* ---------- panel ---------- */
.panel{position:absolute;right:clamp(18px,3.2vw,40px);bottom:clamp(18px,3.2vw,40px);display:flex;align-items:center;gap:8px;
  padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(12,13,17,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel button{appearance:none;border:0;background:transparent;color:var(--ink);font-family:var(--sans);font-size:11px;letter-spacing:.12em;
  cursor:pointer;padding:7px 13px;border-radius:999px;transition:background .18s,color .18s}
.panel button:hover{background:rgba(201,168,106,.14);color:#fff}
.panel .icon{min-width:40px;font-size:10px;letter-spacing:.06em;color:var(--brass)}
.panel .ghost{border-left:1px solid var(--line);border-radius:0 999px 999px 0;color:rgba(233,227,214,.62)}
.panel .ghost:hover{color:var(--ink)}
.speeds{display:flex;gap:2px;padding:0 8px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.speeds button{font-variant-numeric:tabular-nums;padding:7px 9px;color:rgba(233,227,214,.5)}
.speeds button.on{color:#0b0c10;background:var(--brass);font-weight:600}

/* ---------- footer text ---------- */
.hint,.note{position:absolute;font-size:10px;letter-spacing:.2em;color:rgba(233,227,214,.34)}
.hint{right:clamp(18px,3.2vw,40px);bottom:clamp(74px,9vh,96px);text-align:right}
.note{left:50%;transform:translateX(-50%);bottom:clamp(14px,2.4vw,26px);width:100%;text-align:center;letter-spacing:.14em;font-size:9.5px;color:rgba(233,227,214,.22)}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;transition:opacity .8s ease;font-family:var(--serif);
  font-size:12px;letter-spacing:.6em;color:var(--brass)}
#boot.gone{opacity:0;pointer-events:none}

@media (max-width:720px){
  .hud{padding:16px}
  .legend{left:16px;bottom:112px;gap:5px}
  .legend li{font-size:10px}
  .panel{right:16px;bottom:16px;transform:scale(.94);transform-origin:bottom right}
  .hint{display:none}
  .note{display:none}
  .title h1{letter-spacing:.16em}
}
@media (prefers-reduced-motion:reduce){
  .legend li{animation:none;opacity:1;transform:none}
}
</style>
</head>

<a id="arc-back" href="../index.html" title="回到艺术回廊" style="position:fixed;left:10px;bottom:10px;z-index:2147483000;font:12px/1.7 system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#d8e8ff;background:rgba(6,10,20,.74);border:1px solid rgba(150,200,255,.38);border-radius:3px;padding:5px 10px;text-decoration:none;letter-spacing:.5px;backdrop-filter:blur(2px)">← 回 廊</a>

</div>
