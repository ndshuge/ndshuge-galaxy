<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>意识花园 · Neural Garden</title>
<style>
/* finesse · register=brand · A=deep-space-black+neural-cyan · B=200/300 thin display
 * C=full-bleed engine + minimal overlay HUD · D=Three.js procedural scene
 * E=liquid glass + brushed metal · SOUL=9 SPECTACLE=9 DENSITY=2 */

:root{
  --black:#050510;          /* 深空黑 */
  --black-2:#08060f;        /* 非纯黑，带紫 */
  --ink:#e8f4ff;            /* 非纯白，偏冷 */
  --cyan:#00e5ff;           /* 神经青 */
  --violet:#8a2be2;         /* 灵魂紫 */
  --gold:#ffd166;           /* 生命金 */
  --ui:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--black);color:var(--ink)}
body{font-family:var(--ui);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--black)}

/* HUD：只做标注，不抢画面 */
.hud{position:fixed;inset:0;pointer-events:none;z-index:3;
     padding:clamp(20px,3.2vw,44px);padding-bottom:clamp(24px,4vw,52px);
     display:grid;align-content:space-between;justify-items:start}

.title-block h1{
  margin:0;font-weight:200;font-size:clamp(26px,3.3vw,50px);line-height:1.02;
  letter-spacing:.30em;text-indent:.30em;
  color:var(--ink);text-shadow:0 0 46px rgba(0,229,255,.20)
}
.title-block .sub{
  margin:14px 0 0;font-family:var(--mono);font-size:clamp(9px,1vw,11px);
  letter-spacing:.34em;color:rgba(232,244,255,.40);text-transform:uppercase
}
.title-block .sub i{margin:0 .5em;font-style:normal;color:rgba(0,229,255,.55)}

/* 时间轴：三个刻度，一个亮 */
.era-block{position:fixed;right:clamp(20px,3.2vw,44px);top:50%;transform:translateY(-50%);
  display:grid;gap:10px;justify-items:end;text-align:right}
.era-block .cap{font-family:var(--mono);font-size:9px;letter-spacing:.32em;color:rgba(232,244,255,.30)}
.ticks{display:grid;gap:7px;justify-items:end}
.tick{display:block;width:22px;height:1px;background:rgba(232,244,255,.20);transition:width .5s ease,background .5s ease}
.tick.on{width:44px;background:var(--cyan);box-shadow:0 0 12px rgba(0,229,255,.7)}
.names{display:grid;gap:7px;justify-items:end;font-size:9px;letter-spacing:.26em;color:rgba(232,244,255,.28)}
.names b{font-weight:400}

/* 状态 */
.state-block{position:fixed;left:50%;bottom:calc(clamp(24px,4vw,52px) + 42px);transform:translateX(-50%);
  display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;
  letter-spacing:.30em;color:rgba(232,244,255,.52)}
.state-block .led{width:5px;height:5px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 10px var(--cyan);animation:pulse 3.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* 提示：只出现一次，之后退到背景里 */
.hint{position:fixed;left:50%;bottom:clamp(20px,3.4vw,42px);transform:translateX(-50%);
  display:flex;gap:12px;white-space:nowrap;font-size:clamp(10px,1.05vw,12px);
  letter-spacing:.24em;color:rgba(232,244,255,.46);
  transition:opacity 1.6s ease}
.hint i{font-style:normal;color:rgba(0,229,255,.45)}
body.quiet .hint{opacity:.12}
body.engaged .title-block h1{text-shadow:0 0 60px rgba(0,229,255,.34)}

/* 颗粒：让 HUD 与实时画面共享同一质感 */
.grain{position:fixed;inset:-50%;z-index:4;pointer-events:none;opacity:.013;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
  animation:grain 7s steps(6) infinite}
@keyframes grain{
  0%{transform:translate(0,0)}20%{transform:translate(-2%,1%)}40%{transform:translate(1%,-2%)}
  60%{transform:translate(-1%,2%)}80%{transform:translate(2%,-1%)}100%{transform:translate(0,0)}}

/* 启动层 */
.boot{position:fixed;inset:0;z-index:6;background:var(--black);display:grid;place-content:center;
  justify-items:center;gap:18px;transition:opacity 1.1s ease}
.boot span{font-family:var(--mono);font-size:10px;letter-spacing:.40em;color:rgba(232,244,255,.42)}
.boot::after{content:"";width:74px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,229,255,.75),transparent);
  animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{0%,100%{opacity:.25;transform:scaleX(.55)}50%{opacity:1;transform:scaleX(1)}}
.boot:not(.on){opacity:0;pointer-events:none}

@media (max-width:700px){
  .era-block{top:auto;bottom:calc(clamp(24px,4vw,52px) + 92px);transform:none;right:auto;left:clamp(20px,3.2vw,44px);justify-items:start;text-align:left}
  .ticks,.names{justify-items:start}
  .tick.on{width:34px}
  .hint{letter-spacing:.16em;gap:8px}
  .state-block{bottom:calc(clamp(24px,4vw,52px) + 36px)}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .state-block .led{opacity:.8}
}

</style>
</head>
<body>
<a id="arc-back" href="../index.html" title="回到艺术回廊" style="position:fixed;left:10px;bottom:10px;z-index:2147483000;font:12px/1.7 system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#d8e8ff;background:rgba(6,10,20,.74);border:1px solid rgba(150,200,255,.38);border-radius:3px;padding:5px 10px;text-decoration:none;letter-spacing:.5px;backdrop-filter:blur(2px)">&#8592; &#22238; &#24266;</a>
<canvas id="scene"></canvas>

<div class="hud">
  <header class="title-block">
    <h1>意识花园</h1>
    <p class="sub">NEURAL GARDEN<i>·</i>数字生命体观测记录</p>
  </header>

  <div class="era-block">
    <span class="cap">时间轴</span>
    <div id="hud-era" class="ticks"><i class="tick on"></i><i class="tick"></i><i class="tick"></i></div>
    <span class="names"><b>过去</b><b>现在</b><b>未来</b></span>
  </div>

  <div class="state-block">
    <i class="led"></i><span id="hud-state">密封</span>
  </div>

  <div id="hud-hint" class="hint">
    <span>拖拽环绕</span><i>·</i><span>轻点核心，使其诞生</span><i>·</i><span>滚轮穿越时间</span>
  </div>
</div>

<div id="boot" class="boot on"><span>正在生成神经核心</span></div>
<div class="grain"></div>
