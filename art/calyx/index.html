<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CALYX · 机械花萼 — 鼠哥艺术回廊 №12</title>
<style>:root{
  --ink:#ece5d8;
  --dim:#7e879a;
  --faint:rgba(236,229,216,.38);
  --line:rgba(216,178,106,.16);
  --panel:rgba(9,11,17,.62);
  --accent:#d8b26a;
  --accent2:#5eead4;
  --serif:Georgia,"Songti SC","Source Han Serif SC","Noto Serif SC",serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#050609}
body{color:var(--ink);font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}

#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
  justify-content:space-between;padding:clamp(14px,2.3vw,34px);
  transition:opacity .55s cubic-bezier(.4,0,.2,1)}
body.zen #ui{opacity:0}
body.zen #stage{cursor:none}

.hud-top h1{
  margin:0;font-family:var(--serif);font-weight:400;line-height:.94;
  font-size:clamp(23px,3.1vw,43px);letter-spacing:.44em;
  background:linear-gradient(172deg,#f8eed6 4%,#cda461 58%,#8a6528 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hud-top p{margin:11px 0 0;font-size:9.5px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
.hud-top p b{color:var(--accent);font-weight:400}

.panel{
  pointer-events:auto;position:absolute;width:min(258px,68vw);
  top:clamp(14px,2.3vw,34px);right:clamp(14px,2.3vw,34px);
  padding:15px 15px 13px;border:1px solid var(--line);border-radius:13px;
  background:var(--panel);backdrop-filter:blur(15px) saturate(1.25);
  -webkit-backdrop-filter:blur(15px) saturate(1.25);
  box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
}
.row{margin-bottom:12px}
.row label{display:flex;justify-content:space-between;align-items:baseline;
  font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:5px}
.row label b{font-weight:400;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.06em}

input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:16px;
  background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;border-radius:2px;
  background:linear-gradient(90deg,rgba(216,178,106,.85),rgba(255,255,255,.09))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4.5px;
  border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff8e6,#d8b26a 55%,#6f4f1e);
  box-shadow:0 0 10px rgba(216,178,106,.7)}
input[type=range]::-moz-range-track{height:1px;background:rgba(216,178,106,.55)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;
  background:#d8b26a;box-shadow:0 0 10px rgba(216,178,106,.7)}

.seg{display:flex;gap:5px;margin:14px 0 11px}
.seg button{flex:1;padding:7px 0;border:1px solid rgba(216,178,106,.18);border-radius:8px;
  background:rgba(255,255,255,.02);color:var(--dim);font:inherit;font-size:10px;
  letter-spacing:.14em;cursor:pointer;transition:.22s}
.seg button:hover{color:var(--ink);border-color:rgba(216,178,106,.4)}
.seg button.on{color:#0a0b0f;background:linear-gradient(180deg,#e7c684,#c39a52);border-color:transparent;
  box-shadow:0 4px 16px rgba(216,178,106,.28)}

.toggles{display:flex;gap:5px}
.tgl{flex:1;padding:7px 0;border:1px solid rgba(255,255,255,.08);border-radius:8px;
  background:transparent;color:var(--dim);font:inherit;font-size:10px;letter-spacing:.1em;
  cursor:pointer;transition:.22s}
.tgl:hover{color:var(--ink)}
.tgl.on{color:var(--accent2);border-color:rgba(94,234,212,.42);background:rgba(94,234,212,.07)}

/* 底左角让给回廊回链药丸（与其余展品同一位置），HUD 上提一行 */
.hud-bot{padding-bottom:30px}
.hud-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  font-size:9.5px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.hud-bot #stat{color:rgba(216,178,106,.5)}

#veil{position:fixed;inset:0;background:#050609;display:flex;align-items:center;justify-content:center;
  z-index:9;transition:opacity 1.1s ease .15s}
#veil span{font-family:var(--serif);letter-spacing:.7em;font-size:12px;color:rgba(216,178,106,.55);
  animation:breathe 2.4s ease-in-out infinite}
#veil.gone{opacity:0;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}

@media (max-width:640px){
  .panel{width:min(228px,60vw);padding:12px}
  .hud-bot{font-size:8.5px;letter-spacing:.12em}
  .seg button,.tgl{font-size:9px;letter-spacing:.06em}
}
@media (prefers-reduced-motion:reduce){
  #veil span{animation:none}
}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<!-- 回链（与回廊其余展品同一位置，id 与 href 是上线硬约束，别改） -->
<a id="arc-back" href="../index.html" title="回到艺术回廊" style="position:fixed;left:10px;bottom:10px;z-index:2147483000;font:12px/1.7 system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#d8e8ff;background:rgba(6,10,20,.74);border:1px solid rgba(150,200,255,.38);border-radius:3px;padding:5px 10px;text-decoration:none;letter-spacing:.5px;backdrop-filter:blur(2px)">&#8592; &#22238; &#24266;</a>

<div id="ui">
  <header class="hud-top">
    <h1>CALYX</h1>
    <p>机械花萼 · 参数曲面 <b>24</b> 瓣 ｜ 黄金角 <b>137.5°</b></p>
  </header>

  <aside class="panel" id="panel">
    <div class="row">
      <label>开合度 <b id="v-bloom">38</b></label>
      <input type="range" id="bloom" min="0" max="1" step="0.001" value="0.38">
    </div>
    <div class="row">
      <label>时流 <b id="v-speed">1.00</b></label>
      <input type="range" id="speed" min="0" max="2.5" step="0.01" value="1">
    </div>
    <div class="row">
      <label>光核 <b id="v-core">62</b></label>
      <input type="range" id="core" min="0" max="1" step="0.01" value="0.62">
    </div>
    <div class="seg" id="theme">
      <button data-theme="brass" class="on">黄铜</button>
      <button data-theme="verdigris">铜绿</button>
      <button data-theme="indigo">青金</button>
    </div>
    <div class="toggles">
      <button id="t-bloom" class="tgl on">呼吸绽放</button>
      <button id="t-spin" class="tgl on">自转</button>
      <button id="t-zen" class="tgl">静观</button>
    </div>
  </aside>

  <footer class="hud-bot">
    <span>拖拽旋转 · 滚轮缩放 · 空格呼吸 · 双击绽放</span>
    <span id="stat">lathe · shell · bloom</span>
  </footer>
</div>

<div id="veil"><span>CALYX</span></div>
