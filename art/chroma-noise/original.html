<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHROMA / NOISE</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#08060d;color:#f5f1e8;font-family:Arial,Helvetica,sans-serif}
canvas{position:fixed;inset:0}
.ui{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:40px;mix-blend-mode:difference}
h1{font-size:clamp(80px,18vw,260px);line-height:.75;letter-spacing:-.08em;margin:0;font-weight:900}
h1 span{display:block}
.outline{-webkit-text-stroke:2px white;color:transparent}
.info{position:absolute;bottom:40px;font-family:monospace;font-size:14px}
.cursor{position:fixed;width:40px;height:40px;border:1px solid white;border-radius:50%;pointer-events:none;z-index:3;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cursor" id="cursor"></div>
<div class="ui">
<div>MOVE / CLICK / SCROLL</div>
<h1><span>TOUCH</span><span>THE</span><span class="outline">NOISE</span></h1>
<div class="info">GENERATIVE DIGITAL ART FIELD</div>
</div>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let w,h,mouse={x:0,y:0},particles=[];
function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
addEventListener("resize",resize);resize();

for(let i=0;i<180;i++){
 particles.push({x:Math.random()*w,y:Math.random()*h,s:Math.random()*3+1,v:Math.random()*0.8+.2});
}
addEventListener("pointermove",e=>{
 mouse.x=e.clientX;mouse.y=e.clientY;
 document.getElementById("cursor").style.left=e.clientX+"px";
 document.getElementById("cursor").style.top=e.clientY+"px";
});
addEventListener("click",e=>{
 for(let i=0;i<30;i++)
 particles.push({x:e.clientX,y:e.clientY,s:Math.random()*5+1,v:Math.random()*2+1});
});
function draw(){
 ctx.fillStyle="rgba(8,6,13,.22)";
 ctx.fillRect(0,0,w,h);
 for(const p of particles){
  let dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.sqrt(dx*dx+dy*dy)||1;
  if(d<250){p.x+=dx/d*2;p.y+=dy/d*2}
  p.y-=p.v;
  if(p.y<0)p.y=h;
  ctx.beginPath();
  ctx.fillStyle=`hsla(${(p.x/w)*360},90%,65%,.8)`;
  ctx.arc(p.x,p.y,p.s,0,Math.PI*2);
  ctx.fill();
 }
 requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
