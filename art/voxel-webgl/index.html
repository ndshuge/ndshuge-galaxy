<title>体素晶体 · VOXEL CRYSTAL — 鼠哥艺术回廊 №09</title>
<meta name="description" content="589 个立方体长成的立方八面体晶格，悬在暗场里自转。拖拽转视角，点一下把它炸散再拼回去。">
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/570/main/result.css" />
<style>
:root{
  --amber:#f0b429; --pale:#ffd98a; --cool:#74c0ff;
  --dim:rgba(216,182,120,.55); --line:rgba(240,180,41,.30);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#04050b}
body{font-family:"Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",ui-monospace,monospace;
  color:#e8dcc0;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
/* 暗角：把注意力收在晶体上，不靠 shader 花预算 */
#vig{position:fixed;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(120% 88% at 50% 46%,transparent 42%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.72) 100%)}
#brand{position:fixed;top:12px;left:16px;z-index:5;font-size:12px;letter-spacing:1px;color:var(--dim)}
#brand s{text-decoration:none;color:rgba(240,180,41,.5)}
#brand b{color:var(--amber);font-weight:normal}
#sysbar{position:fixed;top:12px;right:16px;z-index:5;display:flex;gap:8px;align-items:center}
#snd{font-size:12px;letter-spacing:1px;color:var(--amber);border:1px solid var(--line);
  padding:5px 10px;background:rgba(6,8,16,.72);cursor:pointer}
/* 底左角让给回廊回链药丸（与其余八件同一位置），HUD 上提一行 */
#hud{position:fixed;left:16px;bottom:44px;z-index:5;font-size:12px;letter-spacing:1px;
  color:rgba(216,182,120,.5);white-space:nowrap}
#hint{position:fixed;left:0;right:0;bottom:70px;z-index:5;text-align:center;font-size:12px;
  letter-spacing:1px;color:rgba(240,180,41,.5);pointer-events:none;transition:opacity .9s}
#hint.gone{opacity:0}
#boot{position:fixed;inset:0;z-index:50;background:#03040a;pointer-events:none;transition:opacity 1.1s ease .15s}
#boot.gone{opacity:0}
@media (max-width:820px){
  #hint{font-size:11px;bottom:30px}
  #hud{font-size:11px}
  #brand{font-size:11px}
}
@media (prefers-reduced-motion:reduce){ #boot{transition-duration:.3s} }
</style>
