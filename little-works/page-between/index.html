<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>页间 · 阅读</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#292723;background:#f7f5f1}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible{outline:3px solid #ba9772;outline-offset:3px}.main{max-width:1250px;margin:auto;padding:28px clamp(20px,6vw,80px) 90px}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:650;font-size:25px;letter-spacing:-.08em}.tag{font-size:13px;color:#918b82;margin-left:15px;font-weight:400;letter-spacing:0}.glass{border:1px solid #fff9;background:#ffffffa8;box-shadow:0 12px 38px #34271813,inset 0 1px 0 #fff;backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5)}.round{height:45px;min-width:45px;border-radius:50%;border:0;background:#e9e6e0aa;color:inherit}.nav a{color:inherit;text-decoration:none}.lead{padding:82px 0 45px}.lead .sub{font-size:15px;color:#807a71}.lead h1{font-size:clamp(41px,6vw,72px);line-height:1.14;letter-spacing:-.07em;font-weight:620;margin:9px 0 18px}.lead p{color:#8d877d;margin:0}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:26px}.hero{background:#e9e3d9;border-radius:30px;display:grid;grid-template-columns:44% 56%;min-height:400px;overflow:hidden}.art{display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#f0d9b5,transparent 62%),#c8a688;padding:22px}.cover{width:min(74%,200px);aspect-ratio:.7;box-shadow:13px 18px 22px #33262155,inset 7px 0 8px #ffffff20;border-radius:3px 9px 9px 3px;background:linear-gradient(150deg,#996950,#422d30);color:#fff;padding:25px 18px;display:flex;justify-content:space-between;flex-direction:column;transform:rotate(-6deg);transition:transform .35s}.hero:hover .cover{transform:rotate(-2deg) translateY(-7px)}.cover strong{font:600 clamp(27px,3.1vw,43px)/1.35 "Songti SC",serif}.cover small{font-size:11px}.hero-copy{padding:45px clamp(20px,3vw,45px);display:flex;align-items:start;flex-direction:column;justify-content:center}.hero-copy small{color:#847b70}.hero-copy h2{font-size:clamp(32px,4vw,53px);letter-spacing:-.06em;margin:14px 0}.hero-copy p{color:#766e64;line-height:1.85;font-size:14px}.primary{border:0;background:#302b26;color:#fff;border-radius:100px;padding:14px 22px;margin-top:18px}.primary:hover{background:#5c4e43}.upload{background:#fff9;border:1px solid #e8e2da;border-radius:30px;padding:36px;display:flex;flex-direction:column;align-items:start;justify-content:center}.upload h2{font-size:27px;letter-spacing:-.04em}.upload p{font-size:14px;color:#81786f;line-height:1.9}.upload button{border:1px solid #dbd4ca;background:#fff;border-radius:100px;padding:13px 22px;margin-top:18px}.shelfhead{display:flex;align-items:center;justify-content:space-between;margin:55px 0 25px}.shelfhead h2{font-size:27px;letter-spacing:-.05em}.shelfhead span{color:#898279;font-size:13px}.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:27px}.book{border:0;background:none;text-align:left;padding:0}.mini{aspect-ratio:.73;border-radius:4px 10px 10px 4px;box-shadow:7px 9px 17px #34291f30,inset 5px 0 6px #ffffff26;padding:20px;color:white;display:flex;flex-direction:column;justify-content:space-between;transition:transform .25s}.mini strong{font:600 26px/1.35 "Songti SC",serif}.mini small{font-size:11px}.book:hover .mini{transform:translateY(-5px)}.book h3{font-size:16px;font-weight:600;margin:17px 0 6px}.book p{font-size:12px;color:#8a847c;margin:0}.reader{display:none;position:fixed;inset:0;z-index:10;overflow-y:auto;background:var(--paper,#faf8f3);color:var(--ink,#2b2825)}.is-reading .reader{display:block}.reader[data-theme=night]{--paper:#1d1d1e;--ink:#e8e2d8}.reader[data-theme=warm]{--paper:#f1e6d1;--ink:#4d4034}.reader[data-theme=light]{--paper:#faf8f3;--ink:#302b26}.toolbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;background:color-mix(in srgb,var(--paper) 80%,transparent);backdrop-filter:blur(22px)}.toolbar button{border:0;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:50%;width:43px;height:43px;color:var(--ink)}.toolbar .mid{font-size:13px;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.page{max-width:750px;margin:auto;padding:clamp(45px,9vh,120px) 27px 140px;font:var(--font-size,21px)/2.15 var(--font-family,"Songti SC",serif)}.page h1{font-size:2em;line-height:1.4;margin:0}.page .author{font:14px/1.8 -apple-system,"PingFang SC",sans-serif;opacity:.5;margin:10px 0 75px}.page p{text-indent:2em;margin:0 0 1.6em;white-space:pre-wrap;overflow-wrap:anywhere}.dock{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;border-radius:100px;padding:9px 16px;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 20px)}.dock input{width:clamp(90px,25vw,240px);accent-color:#9d815f}.dock button{border:0;background:none;font-size:17px;padding:8px}.dock span{font-size:12px;white-space:nowrap}.settings{display:none;position:fixed;z-index:5;top:75px;right:20px;background:#ffffffee;color:#302b27;border-radius:23px;box-shadow:0 20px 70px #0002;padding:25px;width:min(330px,calc(100vw - 40px))}.settings.open{display:block}.setting{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:22px}.setting button{border:1px solid #dad6ce;background:white;border-radius:12px;padding:9px 12px}.setting button.selected{background:#312d28;color:#fff}.setting .buttons{display:flex;gap:5px}.hidden{display:none}footer{text-align:center;margin-top:85px;font-size:12px;color:#a49c92}@media(max-width:750px){.grid{grid-template-columns:1fr}.hero{min-height:340px}.lead{padding:55px 0 32px}.upload{min-height:230px}.shelf{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:450px){.main{padding:21px 18px 70px}.tag{display:none}.lead h1{font-size:43px}.hero{min-height:285px;border-radius:24px}.cover{width:92%;padding:15px 11px}.cover strong{font-size:28px}.hero-copy{padding:17px}.hero-copy h2{font-size:30px}.hero-copy p{font-size:12px}.primary{padding:12px 14px;margin-top:7px}.upload{padding:26px;border-radius:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media(prefers-reduced-transparency:reduce){.glass,.toolbar{backdrop-filter:none;background:#f1ece5}}</style></head>
<body><main class="main"><nav class="nav"><div class="logo">页间<span class="tag">让阅读回到阅读。</span></div><div><button class="round glass" onclick="document.getElementById('file').click()" aria-label="导入TXT">＋</button> <a class="round glass" href="../" style="display:inline-grid;place-items:center" aria-label="返回小东西">‹</a></div></nav><section class="lead"><div class="sub">你的私人阅读角落</div><h1>把时间，留给文字。</h1><p>一页一页，读到自己喜欢的地方。</p></section><div class="grid"><div class="hero"><div class="art"><div class="cover"><strong>雨停<br>之后</strong><small>页间 · 原创短篇</small></div></div><div class="hero-copy"><small>精选阅读</small><h2>雨停之后</h2><p>有些故事，从雨停的那一刻才真正开始。</p><button class="primary" onclick="openBook('rain')">开始阅读 ↗</button></div></div><div class="upload"><div style="font:35px Georgia">Aa</div><h2>带一本自己的书来。</h2><p>导入 TXT 文件，自由调整字体、字号与纸张颜色。阅读进度只保存在当前浏览器。</p><button onclick="document.getElementById('file').click()">＋ 导入 TXT 文件</button><p style="font-size:12px">无需账号 · 不上传文件</p></div></div><div class="shelfhead"><h2>我的书架</h2><span id="count"></span></div><section class="shelf" id="shelf"></section><footer>页间 · 为那些安静的时刻而造</footer></main><input id="file" class="hidden" type="file" accept=".txt,text/plain">
<div id="reader" class="reader" data-theme="light"><div class="toolbar"><button onclick="closeBook()" aria-label="返回书架">‹</button><div class="mid" id="current-title"></div><div><button onclick="toggleSettings()" aria-label="阅读设置">Aa</button> <button onclick="toggleBookmark()" id="bookmark" aria-label="添加书签">♧</button></div></div><div id="settings" class="settings"><strong>阅读设置</strong><div class="setting"><span>字号</span><div class="buttons"><button onclick="size(-1)">A−</button><button onclick="size(1)">A＋</button></div></div><div class="setting"><span>字体</span><div class="buttons"><button id="font-serif" onclick="font('serif')">宋体</button><button id="font-sans" onclick="font('sans')">黑体</button></div></div><div class="setting"><span>背景</span><div class="buttons"><button id="theme-light" onclick="theme('light')">白</button><button id="theme-warm" onclick="theme('warm')">暖</button><button id="theme-night" onclick="theme('night')">夜</button></div></div></div><article class="page"><h1 id="booktitle"></h1><div id="author" class="author"></div><div id="text"></div></article><div class="dock glass"><button onclick="advance(-1)" aria-label="上一屏">←</button><input id="progress" type="range" min="0" max="100" aria-label="阅读进度"><span id="pct">0%</span><button onclick="advance(1)" aria-label="下一屏">→</button></div></div>
<script>
const sample={id:'rain',title:'雨停之后',author:'页间 · 原创短篇',color:'linear-gradient(150deg,#996950,#422d30)',body:`雨是下午四点停的。其实也没有人专门看时间，只是街口卖糖炒栗子的阿姨忽然掀开了塑料布，像是宣布一件早已商量好的事。
许闻坐在窗边，把那杯已经冷掉的咖啡推远了一点。窗玻璃上有两道水痕，缓缓汇合，接着沿着同一条路流下去。
他原本在等一通电话。等到后来，自己也忘了究竟想听到什么。
街上有个穿黄色雨衣的小孩，一步一步绕过水洼。她的母亲提着两袋菜，走出去几步，又回过头来等她。小孩站在水边，像一个慎重的科学家，终于决定跳过去，却落在水洼正中。
两个人都笑了。
许闻突然想起小时候住的那条街。每当下过雨，楼下的梧桐树就会散发一种清凉的气味。他总觉得，那是树叶把一整个下午重新洗过的味道。
手机亮了。不是那通电话，只是一条普通得不能再普通的消息：楼下的灯修好了。
他穿上外套走出门。天还没有晴，云层却已经薄得能够看见背后的光。
路过花店的时候，他买了一小束白色的花。店员问他送给谁，他想了想，说，就放在家里吧。
人有时候并不需要一个郑重的理由，才可以为平凡的一天留下点什么。
夜里，窗边的花静静开着。许闻终于不再去看手机。他拿起桌上的书，发现上次夹进去的车票还在。
窗外偶尔有车驶过湿润的路面。那声音不像雨，也不像风。
他翻过一页。然后是下一页。`};
const reader=document.getElementById('reader');let books=[sample],current=null,options={size:21,font:'serif',theme:'light'};
try{let saved=JSON.parse(localStorage.getItem('yejian-books')||'[]');if(Array.isArray(saved))books.push(...saved.filter(b=>b&&typeof b.body==='string'&&b.id!=='rain'));options={...options,...JSON.parse(localStorage.getItem('yejian-options')||'{}')}}catch{}
function render(){let shelf=document.getElementById('shelf');shelf.replaceChildren();books.forEach(b=>{const btn=document.createElement('button');btn.className='book';const cov=document.createElement('div');cov.className='mini';cov.style.background=b.color||'linear-gradient(135deg,#746f84,#363a46)';const title=document.createElement('strong');title.textContent=b.title;cov.append(title);const sm=document.createElement('small');sm.textContent=b.author;cov.append(sm);const h=document.createElement('h3');h.textContent=b.title;const p=document.createElement('p');p.textContent=(Number(localStorage.getItem('yejian-progress-'+b.id))||0)+'% 已读';btn.append(cov,h,p);btn.onclick=()=>openBook(b.id);shelf.append(btn)});document.getElementById('count').textContent=books.length+' 本书'}
function openBook(id){current=books.find(b=>b.id===id);if(!current)return;document.body.classList.add('is-reading');document.getElementById('current-title').textContent=current.title;document.getElementById('booktitle').textContent=current.title;document.getElementById('author').textContent=current.author;let target=document.getElementById('text');target.replaceChildren();current.body.replace(/\r/g,'').split(/\n+/).filter(x=>x.trim()).forEach(x=>{let p=document.createElement('p');p.textContent=x;target.append(p)});apply();reader.scrollTop=0;requestAnimationFrame(()=>{reader.scrollTop=(Number(localStorage.getItem('yejian-progress-'+id))||0)/100*Math.max(0,reader.scrollHeight-reader.clientHeight);sync()});mark();document.getElementById('settings').classList.remove('open')}
function closeBook(){document.body.classList.remove('is-reading');current=null;render()}
let timer;reader.addEventListener('scroll',()=>{clearTimeout(timer);timer=setTimeout(sync,140)},{passive:true});
function sync(){if(!current)return;let range=reader.scrollHeight-reader.clientHeight;let p=range?Math.round(reader.scrollTop/range*100):100;p=Math.max(0,Math.min(100,p));document.getElementById('progress').value=p;document.getElementById('pct').textContent=p+'%';try{localStorage.setItem('yejian-progress-'+current.id,p)}catch{}}
document.getElementById('progress').oninput=e=>{reader.scrollTop=Number(e.target.value)/100*(reader.scrollHeight-reader.clientHeight);sync()};
function advance(d){reader.scrollBy({top:d*reader.clientHeight*.78,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'})}
function toggleSettings(){document.getElementById('settings').classList.toggle('open')}
function apply(){reader.dataset.theme=options.theme;reader.style.setProperty('--font-size',options.size+'px');reader.style.setProperty('--font-family',options.font==='serif'?'"Songti SC","STSong",serif':'-apple-system,"PingFang SC",sans-serif');['light','warm','night'].forEach(x=>document.getElementById('theme-'+x).classList.toggle('selected',x===options.theme));['serif','sans'].forEach(x=>document.getElementById('font-'+x).classList.toggle('selected',x===options.font))}
function save(){try{localStorage.setItem('yejian-options',JSON.stringify(options))}catch{}apply()}
function theme(x){options.theme=x;save()}function font(x){options.font=x;save()}function size(x){options.size=Math.max(16,Math.min(32,options.size+x));save()}
function mark(){let active=localStorage.getItem('yejian-bookmark-'+current.id)==='1';document.getElementById('bookmark').textContent=active?'♥':'♡';document.getElementById('bookmark').setAttribute('aria-label',active?'取消书签':'添加书签')}
function toggleBookmark(){if(!current)return;let key='yejian-bookmark-'+current.id;localStorage.setItem(key,localStorage.getItem(key)==='1'?'0':'1');mark()}
document.getElementById('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>4*1024*1024){alert('请选择不超过 4MB 的 TXT 文件');e.target.value='';return}let body=await f.text();if(!body.trim()){alert('文件为空');return}let b={id:'b'+Date.now(),title:f.name.replace(/\.txt$/i,'').slice(0,70),author:'本地导入',body,color:'linear-gradient(145deg,#797180,#333b48)'};books.push(b);try{localStorage.setItem('yejian-books',JSON.stringify(books.filter(x=>x.id!=='rain')))}catch{alert('本地空间不足，文件可能无法保存')};render();openBook(b.id);e.target.value=''};
document.addEventListener('keydown',e=>{if(!current||e.target.tagName==='INPUT')return;if(e.key==='Escape'){document.getElementById('settings').classList.contains('open')?toggleSettings():closeBook()}if(e.key==='PageDown'||e.key==='ArrowRight')advance(1);if(e.key==='PageUp'||e.key==='ArrowLeft')advance(-1)});render();apply();
</script></body></html>
