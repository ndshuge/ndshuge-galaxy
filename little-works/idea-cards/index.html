<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>灵感卡片</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#24242d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #9586e0;outline-offset:3px}.wrap{max-width:1100px;margin:auto;padding:0 24px 130px}.nav{height:82px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:700;font-size:20px;letter-spacing:-.04em}.brand b{display:inline-grid;place-items:center;color:white;background:#9b86dc;border-radius:13px;width:38px;height:38px;margin-right:10px}.primary{border:0;background:#262630;color:#fff;border-radius:15px;min-height:46px;padding:0 19px;font-weight:600}.primary:active{transform:scale(.97)}.subtle{background:none;border:0;padding:10px;color:#7d7d86}.hero{padding:50px 0 29px;display:flex;align-items:end;justify-content:space-between}.hero h1{font-size:clamp(39px,5vw,58px);letter-spacing:-.065em;margin:0;line-height:1.15}.hero p{color:#888894;margin:12px 0 0}.count{font-size:14px;color:#898994}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:23px}.filters{display:flex;gap:5px;overflow:auto;scrollbar-width:none}.filter{white-space:nowrap;border:0;background:transparent;color:#777783;border-radius:40px;padding:11px 16px;min-height:44px}.filter.active{background:#292931;color:white}.search{display:flex;align-items:center;background:#e9e9ee;border-radius:14px;padding:0 13px;min-height:44px;color:#888}.search input{background:none;border:0;outline:none;padding:9px;width:165px;color:#222}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{padding:23px;background:white;min-height:205px;border-radius:25px;display:flex;flex-direction:column;position:relative;box-shadow:0 8px 25px #2820320b;transition:transform .25s cubic-bezier(.2,.8,.2,1)}.card:hover{transform:translateY(-3px)}.card[data-color=violet]{background:#ebe5f9}.card[data-color=peach]{background:#f9e7df}.card[data-color=mint]{background:#e2f0e9}.card[data-color=blue]{background:#e5ecf9}.card[data-color=cream]{background:#f6ecda}.ctop,.foot{display:flex;align-items:center;justify-content:space-between}.cat,.foot{font-size:12px;color:#777985}.cat{font-weight:650}.more{border:0;border-radius:11px;background:#ffffff90;width:38px;height:38px;color:#666;font-size:20px}.card h2{font-size:23px;line-height:1.32;letter-spacing:-.04em;margin:20px 0 8px;overflow-wrap:anywhere}.card p{font-size:15px;line-height:1.7;color:#595964;margin:0 0 18px;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.foot{margin-top:auto}.star{font-size:21px;color:#81818a;border:0;background:none}.star[aria-pressed=true]{color:#af7e27}.menu{position:absolute;right:16px;top:63px;background:#fffffff0;backdrop-filter:blur(20px);border-radius:15px;box-shadow:0 15px 35px #1112;padding:5px;min-width:145px;z-index:2}.menu button{display:block;border:0;background:none;width:100%;text-align:left;border-radius:10px;padding:12px}.menu button:hover{background:#f0eff4}.menu .red{color:#d44b52}.empty{grid-column:1/-1;text-align:center;color:#8a8a94;padding:90px 8px}.empty strong{display:block;font-size:23px;color:#272730;margin-bottom:10px}.backdrop{position:fixed;inset:0;background:#20202c60;backdrop-filter:blur(6px);z-index:10;display:grid;place-items:center;padding:16px}.hidden{display:none!important}.sheet{width:min(100%,510px);max-height:92dvh;overflow:auto;background:#faf9fdf5;backdrop-filter:blur(30px);padding:26px;border-radius:29px;box-shadow:0 25px 75px #0004;animation:up .33s cubic-bezier(.2,.8,.2,1)}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.sheethead h2{font-size:25px;margin:0}.close{border:0;border-radius:50%;width:39px;height:39px;background:#ebeaf0;font-size:24px;color:#686873}.field{display:block;font-size:13px;font-weight:650;color:#777784;margin:0 0 17px}.field input,.field textarea,.field select{width:100%;display:block;margin-top:8px;border:1px solid #e2e1e9;border-radius:13px;background:white;padding:13px 14px;color:#25252d;font-size:16px}.field textarea{resize:vertical;min-height:135px;line-height:1.6}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:#898993}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);border-radius:15px;background:#292933;color:white;padding:13px 19px;z-index:20}@keyframes up{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.wrap{padding:0 19px 100px}.nav{height:73px}.hero{padding:39px 0 29px}.hero p{font-size:15px}.count{display:none}.subtle{font-size:0;padding:8px;min-width:44px;min-height:44px}.subtle:after{content:'⇩';font-size:23px}.toolbar{display:block}.filters{margin:0 -19px 15px;padding:0 19px}.search input{width:100%;flex:1}.grid{grid-template-columns:1fr;gap:13px}.card{min-height:190px}.backdrop{align-items:end;padding:0}.sheet{width:100%;border-radius:28px 28px 0 0;padding-bottom:max(24px,env(safe-area-inset-bottom))}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(prefers-reduced-transparency:reduce){.sheet,.menu{background:#fff;backdrop-filter:none}.backdrop{backdrop-filter:none}}
</style></head><body><div class="wrap"><nav class="nav"><div class="brand"><b>✦</b>灵感卡片</div><div><button id="export" class="subtle">导出备份</button><button id="add" class="primary">＋ 记录想法</button></div></nav><header class="hero"><div><h1>把灵感留下。</h1><p>每一个值得记住的念头，都有自己的位置。</p></div><span id="count" class="count"></span></header><section class="toolbar"><nav id="filters" class="filters" aria-label="分类"></nav><label class="search">⌕ <input type="search" id="search" aria-label="搜索灵感" placeholder="搜索想法…"></label></section><main id="grid" class="grid" aria-live="polite"></main></div>
<div id="overlay" class="backdrop hidden"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><div class="sheethead"><h2 id="dialogtitle">记录新灵感</h2><button id="close" class="close" aria-label="关闭">×</button></div><form id="form"><label class="field">标题<input id="title" maxlength="100" required placeholder="这个想法叫什么？"></label><label class="field">想法内容<textarea id="body" maxlength="6000" placeholder="写下脑海里的闪光…"></textarea></label><div class="pair"><label class="field">分类<select id="category"><option>随手记</option><option>创意</option><option>项目</option><option>生活</option><option>学习</option></select></label><label class="field">卡片颜色<select id="color"><option value="white">珍珠白</option><option value="violet">薰衣草</option><option value="peach">暖桃</option><option value="mint">薄荷</option><option value="blue">雾蓝</option><option value="cream">奶油</option></select></label></div><div class="actions"><span>仅保存在当前浏览器</span><button class="primary">保存灵感</button></div></form></section></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';const KEY='shuge-idea-cards-v1',cats=['全部','收藏','随手记','创意','项目','生活','学习'],$=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let list=[],category='全部',term='',menu=null,editing=null,focus=null;try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))list=a.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string').slice(0,2000)}catch(e){console.warn(e)}function save(){try{localStorage.setItem(KEY,JSON.stringify(list));return true}catch(e){alert('保存失败，请检查浏览器存储空间。');return false}}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.add('hidden'),1800)}function render(){$('filters').innerHTML=cats.map(c=>'<button class="filter '+(c===category?'active':'')+'" data-filter="'+c+'" aria-pressed="'+(c===category)+'">'+c+'</button>').join('');const filtered=list.filter(x=>(category==='全部'||(category==='收藏'?x.star:x.category===category))&&(x.title+' '+x.body+' '+x.category).toLowerCase().includes(term.toLowerCase())).sort((a,b)=>Number(!!b.star)-Number(!!a.star)||b.updated-a.updated);$('count').textContent=list.length+' 个念头';$('grid').innerHTML=filtered.length?filtered.map(x=>'<article class="card" data-color="'+esc(x.color)+'"><div class="ctop"><span class="cat">'+esc(x.category)+'</span><button class="more" data-action="menu" data-id="'+esc(x.id)+'" aria-label="管理'+esc(x.title)+'" aria-expanded="'+(menu===x.id)+'">···</button></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.body)+'</p><div class="foot"><span>'+new Date(x.updated).toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+'</span><button class="star" data-action="star" data-id="'+esc(x.id)+'" aria-label="'+(x.star?'取消收藏':'收藏')+'" aria-pressed="'+!!x.star+'">'+(x.star?'★':'☆')+'</button></div>'+(menu===x.id?'<div class="menu"><button data-action="edit" data-id="'+esc(x.id)+'">编辑</button><button class="red" data-action="delete" data-id="'+esc(x.id)+'">删除</button></div>':'')+'</article>').join(''):'<div class="empty"><strong>'+(term||category!=='全部'?'没有找到想法':'从一个念头开始')+'</strong><span>'+(term||category!=='全部'?'试试其他搜索词或分类。':'点击「记录想法」，留住此刻的灵感。')+'</span></div>'}function open(id){focus=document.activeElement;editing=id;const n=list.find(x=>x.id===id);$('form').reset();$('dialogtitle').textContent=n?'编辑灵感':'记录新灵感';$('title').value=n?.title||'';$('body').value=n?.body||'';$('category').value=n?.category||'随手记';$('color').value=n?.color||'white';$('overlay').classList.remove('hidden');document.body.style.overflow='hidden';$('title').focus()}function close(){$('overlay').classList.add('hidden');document.body.style.overflow='';focus?.focus?.()}$('add').onclick=()=>open(null);$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(menu){menu=null;render()}else close()}if(e.key==='Tab'&&!$('overlay').classList.contains('hidden')){const a=[...$('overlay').querySelectorAll('button,input,textarea,select')],i=a.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&i===a.length-1){e.preventDefault();a[0].focus()}}});$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;const before=list.find(x=>x.id===editing),old=list.slice(),n={id:before?.id||(crypto.randomUUID?.()||Date.now().toString()),title,body:$('body').value.trim(),category:$('category').value,color:$('color').value,star:before?.star||false,updated:Date.now()};list=before?list.map(x=>x.id===editing?n:x):[n,...list];if(!save()){list=old;return}close();menu=null;render();toast('已保存灵感')};$('filters').onclick=e=>{if(e.target.dataset.filter){category=e.target.dataset.filter;menu=null;render()}};$('search').oninput=e=>{term=e.target.value;menu=null;render()};$('grid').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const n=list.find(x=>x.id===b.dataset.id);if(!n)return;switch(b.dataset.action){case'menu':menu=menu===n.id?null:n.id;break;case'edit':menu=null;open(n.id);break;case'star':n.star=!n.star;if(!save())n.star=!n.star;menu=null;break;case'delete':if(confirm('确定删除这张卡片吗？')){const old=list;list=list.filter(x=>x.id!==n.id);if(!save())list=old;menu=null;toast('已删除')}break}render()};document.addEventListener('pointerdown',e=>{if(menu&&!e.target.closest('.menu,.more')){menu=null;render()}});$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'灵感卡片',version:1,list},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='灵感卡片-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render()})();
</script></body></html>
