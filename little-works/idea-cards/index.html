<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f5"><meta name="description" content="灵感卡片，一处安放想法的小空间。"><title>灵感卡片 · Idea Cards</title><link rel="stylesheet" href="./style.css"></head><body>
<div class="app">
<aside class="sidebar" aria-label="主导航">
 <a href="../" class="brand"><span class="brand-mark">✳</span><span><b>灵感卡片</b><small>Idea Cards</small></span></a>
 <button class="side-create" data-action="new"><span class="sign">＋</span> 记下灵感 <kbd>N</kbd></button>
 <div class="group-caption">我的空间</div>
 <nav class="sidenav"><button class="nav active" data-view="all"><span>◫</span> 全部灵感 <em id="countAll"></em></button><button class="nav" data-view="star"><span>✧</span> 收藏的 <em id="countStar"></em></button><button class="nav" data-view="archive"><span>▤</span> 已归档 <em id="countArchive"></em></button></nav>
 <div class="group-caption tags-caption">标签</div><div class="side-tags" id="sideTags"></div><div class="fill"></div>
 <button class="review-card" data-action="review"><span class="review-glyph">✳</span><span><b>随机回顾</b><small>重新遇见一个好想法</small></span><span>↗</span></button>
 <div class="privacy"><span class="indicator"></span> 仅存于此设备 <button data-action="backup">导出备份</button></div>
</aside>
<div class="main">
<header class="topbar"><span class="mobile-brand"><span class="brand-mark">✳</span> 灵感卡片</span><span class="bread">我的空间 <i>/</i> <span id="breadNow">全部灵感</span></span><div class="top-buttons"><button data-action="review" title="随机回顾">✳ <span>回顾</span></button><button data-action="backup" class="desktop-button">↥ <span>导出</span></button><button class="import" data-action="import" title="导入备份" aria-label="导入备份">↧</button></div></header>
<main class="content">
<div class="intro"><div><h1>灵感卡片<span>.</span></h1><p>每个突然闪现的念头，都值得一个位置。</p></div><button class="new-pill" data-action="new"><span>＋</span> 新灵感</button></div>
<section class="board" aria-label="灵感收藏">
<div class="board-head"><div><h2 id="sectionTitle">全部想法 <span id="visibleCount">0</span></h2></div><div class="tools"><label class="searchbox"><span>⌕</span><input type="search" id="search" placeholder="搜索想法…" aria-label="搜索灵感"><small>⌘ K</small></label><select id="sort" aria-label="排序"><option value="new">最近更新</option><option value="old">最早记录</option><option value="az">标题排序</option></select></div></div>
<div class="filters" id="filters" aria-label="标签筛选"></div><div class="cards" id="cards"></div>
<div class="empty" id="empty" hidden><div class="empty-glyph">✳</div><h3 id="emptyTitle">从一个念头开始</h3><p id="emptyDesc">记下第一个想法，让它有机会慢慢生长。</p><button data-action="new">新建卡片 ↗</button></div>
</section><footer>留住此刻的灵光。<a href="../">返回小东西 ↗</a></footer>
</main></div></div>
<nav class="dock" aria-label="快捷导航"><button data-view="all" class="active"><span>◫</span><small>全部</small></button><button data-view="star"><span>✧</span><small>收藏</small></button><button class="dock-plus" data-action="new" aria-label="记录新想法">＋</button><button data-view="archive"><span>▤</span><small>归档</small></button><button data-action="review"><span>✳</span><small>回顾</small></button></nav>
<div class="overlay" id="overlay" hidden><div class="scrim" data-action="close"></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grabber"></div><div id="sheetBody"></div></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div><input type="file" accept=".json,application/json" id="fileInput" hidden><script src="./app.js" defer></script></body></html>
