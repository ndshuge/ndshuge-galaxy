e:24px;letter-spacing:-1px;margin:0 0 18px}.modal label{display:block;font-size:12px;color:#717383;margin:13px 0}.modal input,.modal select{display:block;width:100%;margin-top:7px;padding:0 13px;height:43px;border:1px solid #dedeea;border-radius:12px;background:#fff;color:#393b47}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:24px}.danger{margin-right:auto;color:#d36a7b}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#34334e;color:white;padding:10px 17px;border-radius:14px;transition:.3s}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes pop{from{opacity:.5;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}@media(max-width:1050px){.app{grid-template-columns:190px minmax(0,1fr);gap:15px;padding:0 17px}.below{grid-template-columns:1fr}.sidebar{padding:24px 12px}.grid{grid-auto-rows:minmax(85px,1fr)}}@media(max-width:750px){.app{display:block;margin:13px auto;padding:0 12px}.sidebar{min-height:0;flex-direction:row;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:22px;margin-bottom:23px}.brand{margin:0;font-size:18px}.logo{width:31px;height:31px;font-size:20px;border-radius:10px}.side-label,.mini,.sidefoot{display:none}.nav{flex-direction:row}.nav button{font-size:12px;padding:9px}.top{margin:0 3px 21px}.subtitle{font-size:11px}.top h1{font-size:31px;letter-spacing:-1.4px}.actions{gap:5px}.btn{height:38px;padding:0 10px;font-size:12px;border-radius:12px}.square{width:36px;font-size:21px}.calendar{min-height:0;border-radius:23px}.calheader{padding:18px 14px 8px}.month{font-size:19px}.month small{font-size:11px;margin-left:4px}.segment button{padding:5px 9px}.weekdays{padding:0 5px}.weekdays span{padding:8px 7px;font-size:10px}.grid{grid-auto-rows:minmax(74px,1fr);padding:0 5px 8px}.day{padding:4px 2px;min-height:74px}.number{width:27px;height:27px;font-size:11px}.event{padding:3px;font-size:9px;border-left-width:2px;margin </style><link rel="stylesheet" href="./refined.css"><link rel="stylesheet" href="./ios-finish.css?v=20261026-integrated-dock"><link rel="stylesheet" href="./optical-typography.css?v=2"><link rel="stylesheet" href="./touch-polish.css?v=1"><link rel="stylesheet" href="./ios-type-system.css?v=20261026-compact"><link rel="stylesheet" href="./system-v3.css?v=1"><link rel="stylesheet" href="./sheet-v4.css?v=1"><link rel="stylesheet" href="./calendar-toolbar.css?v=1"><link rel="stylesheet" href="./spacing-v5.css?v=1"><link rel="stylesheet" href="./segment-stable.css?v=1"><link rel="stylesheet" href="./view-motion-v6.css?v=1"><link rel="stylesheet" href="./interaction-v6.css?v=1"><body><script>/* Apply appearance before first paint: prevents a light flash on slow networks. */try{const q=new URLSearchParams(location.search).get('appearance');const saved=localStorage.getItem('shixu-appearance');const body=document.body||document.currentScript?.parentElement;if(body)body.dataset.theme=q==='dark'||q==='light'?q:saved==='dark'?'dark':'light'}catch{if(document.body)document.body.dataset.theme='light'}</script><div class="app"><aside class="sidebar glass"><div class="brand"><span class="logo">◷</span>时序</div><nav class="nav"><div class="side-label">浏览</div><button id="navMonth" class="active">▦　月视图</button><button id="navToday">◷　今天</button></nav><section class="mini"><div class="mini-title" id="miniTitle"></div><div class="mini-grid" id="miniGrid"></div></section><div class="sidefoot">留一点时间给自己。<br>日程仅保存在当前浏览器。</div></aside><main><header class="top"><div><div class="subtitle" id="subtitle"></div><h1>日历</h1></div><button class="btn" type="button" id="themeToggle" aria-label="切换深色外观" title="切换深色外观">◐</button><div class="actions"><button class="btn todayBtn" id="today">今天</button><button class="btn square" id="prev" aria-label="上一月">‹</button><button class="btn square" id="next" aria-label="下一月">›</button><button class="btn primary" id="add">＋ 新建日程</button></div></header><section class="calendar glass"><div class="calheader"><div class="month" id="month"></div><lg-segmented class="segment" value="month" label="日历视图"><button class="on" id="monthMode" value="month">月</button><button id="weekMode" value="week">周</button></lg-segmented></div><div class="weekdays"><span>周日</span><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span></div><div class="grid" id="grid"></div></section><div class="below"><section class="panel glass"><div class="panelhead"><b id="dayTitle"></b><span id="count"></span></div><div class="agendas" id="agendas"></div></section></div></main></div><div class="overlay" id="overlay"><form class="modal glass" id="form" role="dialog" aria-modal="true" aria-labelledby="formTitle"><h2 id="formTitle">新的日程</h2><label>名称<input id="name" maxlength="70" required placeholder="例如：去散步"></label><label>日期<input id="date" type="date" required></label><label>时间<input id="time" type="time" value="09:00" required></label><label>分类<select id="category"><option value="purple">个人</option><option value="blue">学习</option><option value="orange">生活</option><option value="pink">重要</option></select></label><div class="modal-actions"><button type="button" class="btn danger" id="remove" hidden>删除</button><button type="button" class="btn" id="cancel">取消</button><button type="submit" class="btn primary">保存日程</button></div></form></div><div class="toast" id="toast" role="status"></div><script>
(()=>{const $=s=>document.querySelector(s),now=new Date(),pad=n=>String(n).padStart(2,'0'),fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),parse=s=>new Date(s+'T12:00:00'),key='shuge-calendar-v1',colors={purple:'#8176ee',blue:'#6aa8db',orange:'#e5a06c',pink:'#da86a8'},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=new Date(now.getFullYear(),now.getMonth(),1),selected=fmt(now),isWeek=false,editing=null,events=[];try{const x=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(x))events=x.filter(e=>e&&typeof e.id==='string'&&typeof e.title==='string'&&/^\d{4}-\d\d-\d\d$/.test(e.date))}catch{}let timer;function notice(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),2000)}function save(){try{localStorage.setItem(key,JSON.stringify(events))}catch{notice('存储不可用，本次仅暂存')}}const entries=d=>events.filter(e=>e.date===d).sort((a,b)=>a.time.localeCompare(b.time));function render(){const y=current.getFullYear(),m=current.getMonth(),base=isWeek?parse(selected):new Date(y,m,1);base.setDate(base.getDate()-base.getDay());$('#subtitle').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})+' · '+now.toLocaleDateString('zh-CN',{weekday:'long'});$('#month').innerHTML=y+'年'+(m+1)+'月 <small>'+['January','February','March','April','May','June','July','August','September','October','November','December'][m]+'</small>';$('#monthMode').classList.toggle('on',!isWeek);$('#weekMode').classList.toggle('on',isWeek);let s='';for(let i=0;i<(isWeek?7:42);i++){const d=new Date(base);d.setDate(base.getDate()+i);const k=fmt(d),list=entries(k);s+='<div class="day '+(d.getMonth()!==m?'outside ':'')+(k===selected?'selected ':'')+(k===fmt(now)?'today':'')+'"><button class="number" data-date="'+k+'" aria-label="'+k+'">'+d.getDate()+'</button>'+list.slice(0,2).map(e=>'<button class="event" data-edit="'+esc(e.id)+'" style="--c:'+colors[e.category||'purple']+'" title="'+esc(e.time+' '+e.title)+'">'+esc(e.title)+'</button>').join('')+(list.length>2?'<div class="more">+'+(list.length-2)+' 项</div>':'')+'</div>'}$('#grid').innerHTML=s;$('#grid').style.gridTemplateRows=isWeek?'minmax(190px,1fr)':'';let mini='<span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>';const start=new Date(y,m,1).getDay();for(let i=0;i<start;i++)mini+='<span></span>';for(let i=1;i<=new Date(y,m+1,0).getDate();i++){const k=fmt(new Date(y,m,i));mini+='<button data-date="'+k+'" class="'+(k===fmt(now)?'today ':'')+(k===selected?'selected':'')+'">'+i+'</button>'}$('#miniTitle').textContent=(m+1)+'月 · '+y;$('#miniGrid').innerHTML=mini;const list=entries(selected),d=parse(selected);$('#dayTitle').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('#count').textContent=list.length?list.length+' 项日程':'0 项日程';$('#agendas').innerHTML=list.length?list.map(e=>'<button class="agenda" data-edit="'+esc(e.id)+'" style="--c:'+colors[e.category||'purple']+'"><b>'+esc(e.title)+'</b><small>'+esc(e.time)+'</small></button>').join(''):'<p class="empty">暂无日程，点击 + 添加。</p>'}function choose(k){selected=k;const d=parse(k);current=new Date(d.getFullYear(),d.getMonth(),1);render()}function today(){choose(fmt(now))}function change(n){if(isWeek){const d=parse(selected);d.setDate(d.getDate()+7*n);choose(fmt(d))}else{current=new Date(current.getFullYear(),current.getMonth()+n,1);choose(fmt(current))}}function open(id){editing=events.find(e=>e.id===id)||null;$('#formTitle').textContent=editing?'编辑日程':'新的日程';$('#name').value=editing?.title||'';$('#date').value=editing?.date||selected;$('#time').value=editing?.time||'09:00';$('#category').value=editing?.category||'purple';$('#remove').hidden=!editing;$('#overlay').classList.add('open');$('#name').focus()}function close(){$('#overlay').classList.remove('open');editing=null;$('#add').focus()}document.addEventListener('click',e=>{const edit=e.target.closest('[data-edit]');if(edit)return open(edit.dataset.edit);const day=e.target.closest('[data-date]');if(day)choose(day.dataset.date)});$('#prev').onclick=()=>change(-1);$('#next').onclick=()=>change(1);$('#today').onclick=$('#navToday').onclick=today;$('#navMonth').onclick=$('#monthMode').onclick=()=>{isWeek=false;render()};$('#weekMode').onclick=()=>{isWeek=true;render()};$('#add').onclick=()=>open();$('#cancel').onclick=close;$('#overlay').onclick=e=>{if(e.target.id==='overlay')close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').classList.contains('open'))close()});$('#remove').onclick=()=>{if(!editing)return;events=events.filter(e=>e.id!==editing.id);save();close();render();notice('已删除日程')};$('#form').onsubmit=e=>{e.preventDefault();const title=$('#name').value.trim(),date=$('#date').value,time=$('#time').value;if(!title||!date||!time)return;const entry={id:editing?.id||'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title,date,time,category:$('#category').value};events=events.filter(e=>e.id!==entry.id);events.push(entry);save();close();choose(date);notice('日程已保存')};render()})();
