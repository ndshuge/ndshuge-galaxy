<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ece7ff"><title>时序 · 光学材质实验</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eae6f6;color:#242237;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}main{max-width:1080px;margin:auto;padding:36px 24px 50px}
.back{font-size:14px;text-decoration:none;color:#6154ac}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:30px 0 26px}.heading h1{margin:0;font-size:clamp(30px,5vw,56px);line-height:1.1;letter-spacing:-1.4px}.heading p{margin:10px 0 0;color:#77728d;font-size:14px}.hint{font-size:12px;color:#625a7d;background:#fff9;padding:10px 13px;border-radius:24px}
.scene{height:min(66vh,600px);min-height:360px;position:relative;overflow:hidden;border-radius:36px;isolation:isolate;background:linear-gradient(140deg,#efe0fb 2%,#a595e3 32%,#5b429e 66%,#342d5b 100%);box-shadow:0 30px 100px #65519b35,inset 0 0 0 1px #fff6}
.scene:before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 24% 30%,#ffe2ca 0,transparent 28%),radial-gradient(circle at 66% 70%,#665cff 0,transparent 38%);filter:blur(40px);animation:drift 12s ease-in-out infinite alternate}
.pattern{position:absolute;inset:0;opacity:.48;background:repeating-linear-gradient(112deg,transparent 0 25px,#ffffff9c 25px 26px,transparent 26px 54px);mask-image:linear-gradient(90deg,#0007,#000)}
.ring{position:absolute;left:50%;top:50%;height:250px;width:250px;border-radius:50%;border:1px solid #fff7;box-shadow:0 0 0 60px #ffffff0b,0 0 0 122px #ffffff0a;transform:translate(-50%,-50%)}
.scene-title{position:absolute;inset:auto auto 32px 34px;color:#fff;letter-spacing:-.03em;font-size:clamp(34px,5vw,65px);font-weight:670;text-shadow:0 7px 30px #271d575a}
.scene-sub{position:absolute;right:30px;top:24px;color:#fff;font-size:13px;letter-spacing:.08em}
.demo-lens{position:absolute!important;left:0!important;top:0!important;right:0!important;bottom:0!important;margin:0!important;width:100%!important;height:100%!important;--lg-surface:#c8b9ff;--lg-text:#fff}.demo-lens .lg-lens__content{width:100%!important;height:100%!important;min-height:100%!important}
.refractive-copy{height:100%;width:100%;background:linear-gradient(145deg,#f6d9ff,#9981df 45%,#554397);position:relative;overflow:hidden}
.refractive-copy:before{content:"";position:absolute;inset:-40%;background:repeating-linear-gradient(112deg,transparent 0 23px,#ffe7ff 24px 25px,transparent 26px 54px),radial-gradient(circle at 70% 40%,#ffe4ba,transparent 34%)}
.refractive-copy span{position:absolute;left:12%;top:37%;font-size:clamp(38px,9vw,100px);font-weight:800;color:#3f2f79;white-space:nowrap;letter-spacing:-.08em}
.caption{margin-top:17px;color:#625d78;font-size:14px;line-height:1.7}
@keyframes drift{from{transform:translate(-3%,-1%) scale(1)}to{transform:translate(4%,3%) scale(1.12)}}
@media(max-width:650px){main{padding:20px 14px}.scene{min-height:430px;border-radius:26px}.scene-title{left:20px;bottom:22px}.heading{display:block}.hint{display:inline-block;margin-top:16px}}
@media(prefers-reduced-motion:reduce){.scene:before{animation:none}}
</style><body><main><a class="back" href="./">← 返回时序日历</a><div class="heading"><div><h1>光，穿过时间。</h1><p>真实折射材质 · 交互研究</p></div><span class="hint">移动鼠标或轻触玻璃</span></div>
<section class="scene"><div class="pattern"></div><div class="ring"></div><div class="scene-sub">LIQUID / OPTICS / STUDY</div><div class="scene-title">Liquid light.</div><lg-lens class="demo-lens" width="265" height="150" radius="70" refraction="21" bezel=".7" curvature="4" chroma=".12" specular=".58"><div class="refractive-copy"><span>时序</span></div></lg-lens></section>
<p class="caption">这是网页端真实 SVG 位移折射与动态透镜示例，不是 Apple 系统原生材质。为了让边缘形变可观察，此页面采用高对比纹理；日历正式界面保留轻盈与可读性。</p></main>
<script type="module" src="./components.js"></script></body></html>
