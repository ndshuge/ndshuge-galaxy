<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="LIMINAL 引力边界，一场可以触摸的宇宙旅行。旋转视角，穿过星云，抵达光的尽头。">
  <title>LIMINAL · 引力边界</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="main.js"></script>
</head>
<body>
  <canvas id="cosmos" aria-label="可拖动旋转的三维宇宙艺术场景">你的浏览器暂不支持此交互画面。</canvas>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="edge-light" aria-hidden="true"></div>

  <div id="loading" role="status" aria-live="polite">
    <div class="loading-mark" aria-hidden="true">L<span>·</span></div>
    <span class="loading-label">正在点亮宇宙</span>
    <div class="loading-track"><span id="load-progress"></span></div>
  </div>

  <div id="fallback" hidden role="alert">
    <span class="eyebrow">LIMINAL</span>
    <h1>光，暂时未能抵达。</h1>
    <p>当前浏览器未能启用图形加速。请使用支持 WebGL 的浏览器重新打开。</p>
  </div>

  <header class="topbar ui">
    <a class="brand" href="#" aria-label="LIMINAL 引力边界首页">
      <span class="brand-symbol" aria-hidden="true"><span></span></span>
      <span>LIMINAL<span class="brand-cn">引力边界</span></span>
    </a>
    <div class="top-meta"><span class="live-dot"></span><span>A COSMIC EXPERIENCE</span></div>
    <div class="top-actions"><a href="../" class="galaxy-home" aria-label="返回鼠哥星系小作品">← 小作品</a>
      <button id="sound" class="icon-button" type="button" aria-label="开启声音" aria-pressed="false" title="声音">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/></svg>
        <span class="tool-text" data-label>声音关</span>
      </button>
      <button id="fullscreen" class="icon-button" type="button" aria-label="切换全屏" title="全屏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
        <span class="tool-text" data-label>全屏</span>
      </button>
    </div>
  </header>

  <main class="hero ui" aria-labelledby="hero-title">
    <div class="hero-copy">
      <div class="eyebrow hero-eyebrow"><span class="short-rule"></span> BEYOND THE VISIBLE</div>
      <h1 id="hero-title">LIMINAL<span class="hero-title-cn">引 力 边 界</span></h1>
      <p class="hero-line">在光的尽头，遇见宇宙。</p>
      <button id="enter" class="enter-button" type="button"><span>进入宇宙</span><span class="enter-circle" aria-hidden="true">↗</span></button>
    </div>
    <div class="scene-index" aria-live="polite">
      <span class="scene-index-number" id="scene-number">01</span>
      <span class="scene-index-line"></span>
      <div><h2 id="scene-name">事件视界</h2><p id="scene-caption">光在此弯曲，时间失去尺度。</p></div>
    </div>
    <div class="orbit-note" aria-hidden="true"><span class="orbit-cross">+</span><span>THE EDGE<br>OF EVERYTHING</span></div>
  </main>

  <div class="gesture-hint ui"><span class="mouse-glyph" aria-hidden="true"></span><span class="desktop-gesture">拖动旋转<span class="hint-divider">/</span>滚轮靠近</span><span class="touch-gesture">滑动旋转 · 双指缩放</span></div>

  <footer class="bottom ui">
    <nav class="chapters" aria-label="宇宙场景">
      <button type="button" class="chapter active" data-scene="0" aria-pressed="true"><span class="chapter-no">01</span><span>视界</span><span class="chapter-english">HORIZON</span></button>
      <button type="button" class="chapter" data-scene="1" aria-pressed="false"><span class="chapter-no">02</span><span>星云</span><span class="chapter-english">NEBULA</span></button>
      <button type="button" class="chapter" data-scene="2" aria-pressed="false"><span class="chapter-no">03</span><span>跃迁</span><span class="chapter-english">TRANSIT</span></button>
    </nav>
    <div class="transport">
      <button id="pause" class="icon-button" type="button" aria-label="暂停" aria-pressed="false" title="暂停 / Space"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><span class="tool-text" data-label>暂停</span></button>
      <label class="speed-control" for="speed"><span>时间流速</span><input id="speed" type="range" min="0.2" max="2" step="0.1" value="1" aria-label="时间流速"><output id="speed-value" for="speed">1.0×</output></label>
      <button id="capture" class="icon-button" type="button" aria-label="保存当前画面" title="留影"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 7h4l2-3h4l2 3h4v13H4Z"/><circle cx="12" cy="13" r="4"/></svg><span class="tool-text">留影</span></button>
    </div>
    <div class="colophon"><span>艺术化宇宙 · 非天文测量</span><span class="keyboard-hint"><kbd>H</kbd> 隐藏界面 <span>·</span> <kbd>SPACE</kbd> 暂停</span></div>
  </footer>
  <button id="leave" type="button" class="leave-button" aria-label="显示界面"><span class="leave-symbol" aria-hidden="true">+</span><span>显示界面</span></button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
