<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><title>时光胶囊 · Moments</title><link rel="stylesheet" href="style.css"><body><div class="wrap"><header><a href="../" class="brand"><b>✳</b> 时光胶囊 <small>/ MOMENTS</small></a><div class="headtools"><button id="export" title="导出备份" aria-label="导出备份">⇩</button><button id="import" title="导入备份" aria-label="导入备份">⇧</button><input id="file" type="file" accept="application/json" hidden><button class="dark" data-create>＋ 记录此刻</button></div></header><main><section class="hero"><div class="herotext"><div class="eyebrow">✳ &nbsp; A SPACE FOR WHAT MATTERS</div><h1>日子会向前，<br><em>记忆会发光。</em></h1><p>收藏一段旅程、一场相遇，或只是某个平凡又温柔的下午。</p><button class="dark big" data-create>写下一个瞬间 &nbsp;↗</button><p class="privacy">你的故事，只保存在这台设备</p></div><div class="visual" aria-hidden="true"><div class="ring one"></div><div class="ring two"></div><div class="sphere"><span>✦</span><small>THIS MOMENT</small></div><div class="star">✳</div></div></section><div class="sectionhead"><div><div class="eyebrow muted">YOUR COLLECTION</div><h2>时光收藏 <sup id="count">00</sup></h2></div><nav aria-label="回忆筛选"><button class="active" data-filter="all">全部</button><button data-filter="favorite">珍藏</button><button data-filter="year">今年</button></nav></div><div class="tools"><input id="search" type="search" placeholder="搜索名字、地点或心情…" aria-label="搜索回忆"><select id="sort" aria-label="排序"><option value="new">最近发生</option><option value="old">最早发生</option><option value="added">最近记录</option></select></div><div id="cards" class="cards" aria-live="polite"></div><div id="empty" class="empty" hidden><div>✦</div><h3>故事，就从这一刻开始。</h3><p>写下第一段回忆，让时间有迹可循。</p><button class="dark" data-create>添加回忆 ↗</button></div></main><footer><span>✳ MOMENTS · 把平凡的日子，过成珍藏。</span><span>PRIVATE BY DESIGN · LOCAL FIRST</span></footer></div><dialog id="editor"><form id="form"><div class="dialoghead"><div><span class="eyebrow muted">CAPTURE A MOMENT</span><h2 id="formHeading">记录一个瞬间</h2></div><button class="x" type="button" data-close>×</button></div><label>这一刻的名字<input name="title" required maxlength="80" placeholder="例如：那天的海风"></label><div class="cols"><label>发生在<input name="date" type="date" required></label><label>心情<select name="mood"><option>温柔</option><option>快乐</option><option>激动</option><option>平静</option><option>怀念</option><option>勇敢</option></select></label></div><label>在哪里（选填）<input name="place" maxlength="80" placeholder="一座城市、一家咖啡店…"></label><label>这一刻的故事<textarea name="story" rows="5" required maxlength="5000" placeholder="闭上眼睛，还能记得的画面是什么？"></textarea></label><label>照片（选填）<input id="photo" type="file" accept="image/*"><small id="photoLabel">自动压缩并保存在浏览器里</small></label><div class="dialogbuttons"><button id="delete" class="red" type="button" hidden>删除回忆</button><div class="right"><button class="light" type="button" data-close>取消</button><button class="dark" type="submit">保存这一刻 ↗</button></div></div></form></dialog><dialog id="detail"><div class="detail"><button class="x closeDetail" type="button" id="closeDetail">×</button><div class="detailImg" id="detailImg"></div><div class="detailBody"><span class="eyebrow muted" id="detailDate"></span><h2 id="detailTitle"></h2><span id="detailPlace"></span><p id="detailStory"></p><div class="right spaced"><button class="light" id="favDetail">♡ 珍藏</button><button class="dark" id="editDetail">编辑记忆 ↗</button></div></div></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js" defer></script></body></html>
