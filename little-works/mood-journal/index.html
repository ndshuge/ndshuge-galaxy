<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f1"><title>心绪 · 每一天，都有颜色</title><meta name="description" content="心绪：记录每日心情与日记，在日历中回顾生活。仅保存在此浏览器。"><link rel="stylesheet" href="./style.css"></head>
<body data-view="write"><div class="app">
<aside class="sidebar"><a class="brand" href="../"><span class="mark">✳</span><span>心绪<small>给日子一点回声</small></span></a><nav class="sidenav" aria-label="主要导航"><span class="nav-label">我的手账</span><button data-nav="write" class="nav-item current" type="button">◌ &nbsp;每日记录</button><button data-nav="calendar" class="nav-item" type="button">▦ &nbsp;时光回顾</button></nav><div class="side-bottom"><span class="privacy">● &nbsp;私人空间 · 本地保存</span><button id="backupButton" class="side-action" type="button">备份与恢复 <span>↗</span></button><a class="back-link" href="../">← 返回小东西</a></div></aside>
<div class="workspace"><header class="topbar"><strong class="mini-brand">✳ &nbsp;心绪</strong><span id="topDate"></span><span class="topright">只属于你的空间 <button id="mobileBackup" class="mobile-backup" type="button" aria-label="备份与恢复">⇧</button></span></header>
<nav class="mobile-tabs" aria-label="切换视图"><button type="button" class="active" data-nav="write">记录</button><button type="button" data-nav="calendar">回顾</button></nav>
<main class="content"><section class="editor-column" id="writeView">
<div class="intro"><div class="intro-copy"><div id="datePill" class="date-pill"></div><h1 id="pageTitle">今天，<br>心里是什么天气？</h1><p id="introHint">挑一种心情，再写下想说的话。</p></div><div class="aura" aria-hidden="true"><span></span></div></div>
<section class="mood-section" aria-label="心情选择"><div class="section-heading"><h2>这一刻的心情</h2><span id="moodState">请选择一种感受</span></div><div id="moodChoices" class="moods" role="group" aria-label="选择心情">
<button class="mood" data-mood="radiant" type="button" aria-pressed="false"><span class="mood-face">🥰</span><span>很开心</span></button>
<button class="mood" data-mood="good" type="button" aria-pressed="false"><span class="mood-face">☺️</span><span>很不错</span></button>
<button class="mood" data-mood="okay" type="button" aria-pressed="false"><span class="mood-face">😌</span><span>还算平静</span></button>
<button class="mood" data-mood="low" type="button" aria-pressed="false"><span class="mood-face">😔</span><span>有点低落</span></button>
<button class="mood" data-mood="tired" type="button" aria-pressed="false"><span class="mood-face">😮‍💨</span><span>有些疲惫</span></button>
</div></section>
<section class="paper" aria-label="日记编辑器"><div class="paper-head"><span id="paperDate"></span><span id="paperStatus">写给自己的悄悄话</span></div><label for="entryTitle" class="sr-only">标题</label><input id="entryTitle" placeholder="给今天起个名字…" maxlength="80" autocomplete="off"><label class="sr-only" for="entryBody">正文</label><textarea id="entryBody" placeholder="今天发生了什么？&#10;或许只是一个小小的瞬间…" maxlength="20000" rows="7"></textarea><div class="paper-footer"><span id="wordCount">0 字</span><div class="paper-actions"><button id="deleteEntry" class="delete" type="button" hidden>删除</button><button id="saveEntry" class="save" type="button">保存这一天 &nbsp;↗</button></div></div></section>
<p class="privacy-tip">♧ &nbsp;只在当前浏览器保存，不会自动同步到其他设备。</p></section>
<aside class="calendar-column" id="calendarView"><div class="calendar-card"><div class="calendar-top"><div><p class="overline">日历回顾</p><h2 id="monthTitle"></h2></div><div class="month-arrows"><button id="prevMonth" type="button" aria-label="上个月">‹</button><button id="nextMonth" type="button" aria-label="下个月">›</button></div></div><div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="calendarGrid" class="calendar-grid" role="grid" aria-label="心情日历"></div><div class="legend"><i></i> 有心情记录的日子</div></div><section class="review"><div class="review-head"><h2>最近的日子</h2><span id="recordCount"></span></div><div id="recentEntries" class="recent-list"></div></section><p class="closing">每一种心情，都值得被好好记住。</p></aside></main></div></div>
<dialog class="backup-dialog" id="backupDialog" aria-labelledby="backupTitle"><div class="dialog-content"><div class="dialog-header"><div><h2 id="backupTitle">保管你的心情</h2><p>把日记带在身边，不怕丢失。</p></div><button type="button" id="closeDialog" aria-label="关闭">×</button></div><button id="exportData" class="dialog-option" type="button"><strong>下载日记备份</strong><small>JSON 文件 · 包含全部记录</small></button><button id="importData" class="dialog-option" type="button"><strong>从备份恢复</strong><small>合并记录，同日期以导入内容为准</small></button><p class="dialog-footer">备份中含有私人文字，请妥善保管。</p></div></dialog><input id="importFile" type="file" accept=".json,application/json" hidden><div class="toast" id="toast" role="status" aria-live="polite"></div><script src="./app.js" defer></script></body></html>
