<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7f7"><title>Study Flow · 学习进度</title><link rel="stylesheet" href="./style.css"></head>
<body><div class="shell">
<aside class="rail"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Study Flow</span></div><div class="rail-caption">让每一天都有迹可循。</div><nav aria-label="主导航"><a href="#overview" class="nav active">概览</a><a href="#goals" class="nav">学习目标</a><a href="#trend" class="nav">学习记录</a></nav><div class="rail-foot">专注当下，积累未来。</div></aside>
<div class="workspace"><header class="topbar"><div class="mobile-brand"><span class="mark"><i></i><i></i><i></i></span> Study Flow</div><span class="top-label">学习概览</span><span id="headerDate"></span></header>
<main class="sheet" id="overview">
<div class="heading"><div><p class="eyebrow">你的学习节奏</p><h1>学习概览</h1><p class="subheading">从今天开始，一点一点向目标靠近。</p></div><button id="addGoalTop" class="button secondary">＋ 新建目标</button></div>
<div class="dashboard">
<section class="today-panel" aria-label="今日学习进度"><div class="section-line"><div><span class="section-label">今天已学习</span><div id="todayTime" class="big-number">0<span>小时</span> 0<span>分钟</span></div><p id="todayMessage" class="muted">记录第一段学习时间，开启今天的进度。</p></div><div class="daily-ring" id="ring" role="img" aria-label="今日目标进度"><svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="51" class="ring-track"/><circle cx="60" cy="60" r="51" class="ring-progress" id="ringProgress"/></svg><div><strong id="ringPct">0%</strong><small>今日目标</small></div></div></div><div class="daily-actions"><label>每日目标 <select id="dailyTarget"><option value="60">1 小时</option><option value="120">2 小时</option><option value="180">3 小时</option><option value="240">4 小时</option><option value="300">5 小时</option><option value="360">6 小时</option><option value="480">8 小时</option></select></label><button class="button primary" id="openLog">＋ 记录学习</button></div></section>
<section class="week-panel" id="trend"><div class="section-line"><div><h2>最近七天</h2><p class="muted">每天的投入，看得见。</p></div><div class="week-total"><strong id="weeklyTime">0 小时</strong><small>七天累计</small></div></div><div class="chart" id="chart" aria-label="最近七天学习时间柱状图"></div><p class="chart-foot" id="chartFoot">还没有记录，开始学习后会在这里显示趋势。</p></section>
<section class="goal-panel" id="goals"><div class="section-line"><div><h2>学习目标</h2><p class="muted">为接下来的每一步留一个方向。</p></div><span id="goalCount" class="goal-count">0 个目标</span></div><div id="goalList" class="goal-list"></div><button id="addGoalBottom" class="add-inline">＋ 添加学习目标</button></section>
<section class="recent-panel"><div class="section-line"><div><h2>最近记录</h2><p class="muted">每一段专注都值得留下。</p></div></div><div id="recordList"></div></section>
</div><footer class="page-footer">Study Flow · 数据仅保存在当前浏览器</footer>
</main></div></div>
<dialog id="goalDialog" class="modal"><form id="goalForm"><div class="modal-heading"><h2>新建学习目标</h2><button type="button" class="close" data-close aria-label="关闭">×</button></div><label class="form-label">目标名称<input name="title" maxlength="48" placeholder="例如：完成线性代数第二章" required autofocus></label><label class="form-label">计划学习时长（小时）<input name="hours" type="number" min="0.5" max="1000" step="0.5" value="10" required></label><div class="modal-actions"><button type="button" class="button secondary" data-close>取消</button><button type="submit" class="button primary">创建目标</button></div></form></dialog>
<dialog id="logDialog" class="modal"><form id="logForm"><div class="modal-heading"><h2>记录学习时间</h2><button type="button" class="close" data-close aria-label="关闭">×</button></div><label class="form-label">日期<input id="logDate" name="date" type="date" required></label><label class="form-label">学习目标<select id="logGoal" name="goal"></select></label><label class="form-label">学习时长（分钟）<input name="minutes" type="number" min="1" max="1440" step="1" value="45" required></label><div class="modal-actions"><button type="button" class="button secondary" data-close>取消</button><button type="submit" class="button primary">保存记录</button></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div><script src="./app.js" defer></script></body></html>
