<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050514">
<title>鼠哥星系</title>
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/570/main/result.css" />
<style>
:root{--bg:#050514;--cyan:#00e5ff;--yellow:#ffd54f;--pink:#ff5c8a;--ink:#eafcff;--dim:rgba(150,215,255,.55)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:"Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace;
     user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;color:#bfefff}
#space{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
       image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none}
#crt{position:fixed;inset:0;z-index:7;pointer-events:none;
     background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}
#brand{position:fixed;top:12px;left:16px;z-index:5;font-size:12px;letter-spacing:1px;color:var(--dim);pointer-events:none}
#brand b{color:var(--yellow);font-weight:normal}
#sys{position:fixed;top:12px;right:16px;z-index:5;font-size:12px;letter-spacing:1px;color:var(--dim);
     display:flex;align-items:center;gap:8px;pointer-events:auto;cursor:pointer}
#sysDot{width:8px;height:8px;background:#69f0ae;box-shadow:0 0 8px #69f0ae;animation:blink 1.3s steps(1) infinite}
#sndTag{color:var(--cyan)}
#title{position:fixed;left:0;right:0;top:5vh;text-align:center;pointer-events:none;z-index:5;transition:opacity .3s}
#title h1{font-size:44px;letter-spacing:12px;color:var(--ink);font-weight:normal;min-height:1.1em;
  text-shadow:0 0 10px rgba(0,229,255,.95),0 0 30px rgba(0,229,255,.5),0 0 70px rgba(0,229,255,.3);
  animation:breathe 3.4s ease-in-out infinite}
#title .line{width:140px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  box-shadow:0 0 8px var(--cyan)}
#title .sub{margin-top:6px;font-size:12px;letter-spacing:.5em;color:var(--dim);opacity:0;transition:opacity .9s}
#title .sub.show{opacity:1}
body.warping #title,body.warping #brand,body.warping #sys{opacity:0}
#brand,#sys{transition:opacity .3s}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:9px 16px calc(9px + env(safe-area-inset-bottom));font-size:12px;letter-spacing:1px;
  color:var(--dim);background:linear-gradient(to top,rgba(4,7,22,.9),rgba(4,7,22,0));
  border-top:1px solid rgba(0,229,255,.16);pointer-events:none}
#hud #clock{color:#bfefff}
#hud #hintTxt{text-align:center}
#term{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);width:min(520px,88vw);z-index:9;display:none;
  background:rgba(4,8,24,.94);border:1px solid rgba(0,229,255,.4);
  box-shadow:0 0 26px rgba(0,229,255,.22),inset 0 0 18px rgba(0,229,255,.05);
  padding:10px 14px 12px;font-size:12px;line-height:1.8;color:#bfefff}
#term.open{display:block}
#termBar{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:1px;color:var(--cyan);
  border-bottom:1px solid rgba(0,229,255,.3);padding-bottom:6px;margin-bottom:8px}
#termClose{cursor:pointer;pointer-events:auto;padding:0 4px;color:#ff7d9d}
#termClose:hover{color:#ffffff}
#termOut{white-space:pre-wrap;max-height:150px;overflow-y:auto;margin-bottom:6px}
.termRow{display:flex;align-items:center;gap:6px}
#termIn{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--cyan);
  font-family:inherit;font-size:12px;caret-color:var(--yellow)}
#term .prompt{color:var(--yellow)}
@keyframes breathe{0%,100%{opacity:.9}50%{opacity:1}}
@keyframes blink{50%{opacity:0}}
@media (max-width:760px){
  #title h1{font-size:32px;letter-spacing:8px}
  #hud #hintTxt{display:none}
}
@media (orientation:portrait){
  body{background:linear-gradient(#070a1e,#03040e)}
  #space{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);
         mask-image:linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent)}
}
@media (prefers-reduced-motion:reduce){#title h1{animation:none}#sysDot{animation:none}}

/* v1.8: stable constellation atlas; no changes to destination content. */
html{overflow-x:hidden;overflow-y:auto}body{overflow:visible;position:relative}
#space{position:absolute;left:0;top:0;transform:none;touch-action:pan-y;mask-image:none;-webkit-mask-image:none}
#space,.destination{touch-action:none}
body.exploring #space{cursor:grab}
body.exploring.dragging #space{cursor:grabbing}
body.exploring .destination{cursor:pointer}
body.exploring.dragging .destination{cursor:grabbing}
#crt{opacity:.45}
#brand{position:absolute;top:20px;font-size:11px;letter-spacing:.5px}
#sys{position:absolute;top:12px;border:0;background:transparent;font-family:inherit;color:#b7cfdf;min-height:44px;padding:0 4px}
#title{position:absolute;top:56px}
#title h1{font-size:36px;letter-spacing:8px;text-shadow:0 0 18px rgba(0,229,255,.35);animation:none}
#title .line{margin-top:10px;width:96px}#title .sub{letter-spacing:.24em;color:#91b1c8;font-size:11px}
#destinations{position:absolute;inset:0;z-index:4;pointer-events:none}
.destination{position:absolute;transform:translateX(-50%);width:176px;min-height:44px;pointer-events:auto;
  text-decoration:none;color:#eafcff;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0;
  transition:color .15s;outline-offset:4px}
.destination-name{font:500 16px/22px system-ui,sans-serif;text-shadow:0 2px 4px #03040e}
.destination-desc{font:12px/1.4 system-ui,sans-serif;color:#b3cad8;opacity:0;max-width:190px;transition:opacity .15s}
.destination:hover,.destination:focus-visible{color:var(--star-color)}
.destination:hover .destination-desc,.destination:focus-visible .destination-desc{opacity:1}
[hidden]{display:none!important}
.constellation{position:absolute;z-index:3;pointer-events:none;font:12px/1.5 system-ui,sans-serif;letter-spacing:2px;color:#8aa8bd}
.constellation::before{content:'';display:inline-block;width:16px;height:1px;background:#8aa8bd;vertical-align:middle;margin-right:10px}
#controls{position:fixed;z-index:6;bottom:calc(42px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  display:flex;gap:4px;padding:4px;background:rgba(4,8,24,.94);border:1px solid rgba(145,185,215,.28)}
#controls button{font:13px/1.2 system-ui,sans-serif;min-width:64px;min-height:40px;background:transparent;border:0;color:#b6cedd;cursor:pointer;padding:0 12px}
#controls button:hover,#controls button[aria-pressed=true],#controls button[aria-expanded=true]{color:#eafcff;background:#14253a}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #a5e9ff;outline-offset:3px}
#chart{position:fixed;right:20px;bottom:calc(102px + env(safe-area-inset-bottom));z-index:8;width:min(360px,calc(100vw - 32px));
  max-height:calc(100dvh - 160px);overflow-y:auto;background:#080e20;border:1px solid #3e5870;padding:8px}
#chart a{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:#eafcff;font:14px/1.5 system-ui,sans-serif;padding:10px 12px;min-height:48px}
#chart a+a{border-top:1px solid #203047}#chart a:hover,#chart a:focus-visible{background:#14253a}
#chart small{font-size:12px;color:#aac1d1}
#hud{color:#a4bdd0;font-size:11px;letter-spacing:0;gap:8px;z-index:5}
#term{font-size:13px;bottom:110px;border-color:#3e7088;box-shadow:0 12px 36px rgba(0,0,0,.5)}
#termClose{background:transparent;border:0;font:20px/1 system-ui;color:#ffadbc;min-width:44px;min-height:36px}
#termIn{font-size:14px}#termOut{max-height:180px}#termBar{padding-bottom:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
body.warping #destinations,body.warping .constellation,body.warping #controls{opacity:0;pointer-events:none}
body.exploring .constellation{opacity:.72}
@media(max-width:760px){#hud #hintTxt{display:block}#visits{display:none}}
@media(max-width:619px){
  #brand{top:17px;font-size:11px;left:14px}#sys{right:10px;font-size:11px}#sysDot{width:5px;height:5px}
  #title{top:65px}#title h1{font-size:30px;letter-spacing:6px}#title .sub{font-size:11px}
  .destination{width:154px}.destination-name{font-size:15px;line-height:20px}.destination-desc{display:none}
  .constellation{font-size:11px;letter-spacing:1px}.constellation::before{width:12px;margin-right:7px}
  #controls{bottom:calc(36px + env(safe-area-inset-bottom));gap:0;width:max-content;max-width:calc(100vw - 24px)}
  #controls button{min-width:63px;padding:0 8px;min-height:40px;font-size:12px}
  #hud{padding:8px 12px calc(8px + env(safe-area-inset-bottom));font-size:11px}#clock{display:none}
  #hud #hintTxt{width:100%}#chart{right:16px;bottom:96px}#term{bottom:96px;width:calc(100vw - 28px)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}#sysDot{animation:none}}
</style>
</head>
<body>
<canvas id="space" width="480" height="270" aria-hidden="true"></canvas>
<nav id="destinations" aria-label="星系目的地"></nav>
<div class="constellation">学习与求知</div><div class="constellation">创作与游乐</div><div class="constellation">现实与日常</div>
<div id="crt"></div>
<div id="brand">◆ SHUGE GALAXY OS <b>v1.8.2</b></div>
<button id="sys" type="button" aria-label="切换音效" aria-pressed="true"><i id="sysDot" aria-hidden="true"></i>SYS ONLINE <b id="sndTag">[M]♪ON</b></button>
<div id="title"><h1 id="titleText"></h1><div class="line"></div><div class="sub" id="titleSub">S H U G E · G A L A X Y</div></div>
<div id="hud"><span id="clock">--:--:--</span><span id="hintTxt">拖动星空自由漫游 · 点击星系进入 · T 目的地 · / 终端 · R 总览</span><span id="visits"></span></div>
<div id="controls" role="group" aria-label="星图控制"><button id="homeBtn" type="button">总览</button><button id="exploreBtn" type="button" aria-pressed="false">漫游</button><button id="chartBtn" type="button" aria-expanded="false" aria-controls="chart">目的地</button><button id="termBtn" type="button" aria-controls="term">终端</button></div>
<nav id="chart" aria-label="全部目的地" hidden></nav>
<div id="term" role="dialog" aria-modal="false" aria-label="跃迁控制台">
  <div id="termBar"><span>SHUGE-TERM · 跃迁控制台</span><button id="termClose" type="button" aria-label="关闭终端">×</button></div>
  <div id="termOut"></div>
  <div class="termRow"><span class="prompt">guest@shuge:~$</span><label class="sr-only" for="termIn">输入星系名称或 help</label><input id="termIn" autocomplete="off" spellcheck="false" maxlength="60"></div>
</div>
<script>
'use strict';
window.addEventListener('error',function(ev){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;top:70px;left:8px;right:8px;z-index:99;background:#4a0d16;color:#ffd7d7;font:12px monospace;padding:8px;white-space:pre-wrap;border:1px solid #a33';
  d.textContent='页面脚本出错：'+ev.message+'（第'+ev.lineno+'行）——把这行字告诉拉里';
  document.body.appendChild(d);});
/* ============ 配置区 ============
   每一项 = 一个迷你星系（中心核球 + 旋臂 + 盘面星点）。
   armsN = 旋臂条数，可写 2~6；不写则按 z 自动分配（越近的星系臂越多）。
   moons = 盘面漂移亮点的数量。想增删星系，直接增删数组项。 */
const PROJECTS = [
  { name: "鼠哥学院",   desc: "五院共通 · 硬课一起啃",     url: "https://ndshuge.github.io/ndshuge-academy/",   color: "#69f0ae", glow: "#b9ffd5", z: 6,  moons: 5 },
  { name: "鼠哥游戏厅", desc: "实验品与半成品 · 接受拍砖", url: "https://ndshuge.github.io/ndshuge-game/",      color: "#ffd54f", glow: "#fff2a8", z: 7,  moons: 4 },
  { name: "课堂笔记",   desc: "录音转结构化笔记",         url: "https://ndshuge.github.io/ndshuge-classnote/", color: "#b388ff", glow: "#d7bfff", z: 8,  moons: 3 },
  { name: "艺术回廊",   desc: "视觉实验 · 环形回廊",       url: "https://ndshuge.github.io/ndshuge-galaxy/art/", color: "#ff5c8a", glow: "#ff9ec4", z: 9,  moons: 2 },
  { name: "西安勘测",   desc: "真地形 · 从市域推到沟谷",     url: "https://ndshuge.github.io/ndshuge-galaxy/xian/", color: "#4fc3ff", glow: "#a8e3ff", z: 10, moons: 2 },
  { name: "人生罗盘",   desc: "循证生活 · 先看现在最该管的", url: "https://ndshuge.github.io/ndshuge-galaxy/life-guide/", color: "#7cf7c4", glow: "#d5ffe9", z: 8, moons: 3 },
  { name: "小作品", desc: "随手打开的奇妙小世界", url: "https://ndshuge.github.io/ndshuge-galaxy/little-works/", color: "#91d9cb", glow: "#d5fff0", z: 9, moons: 3 },
  { name: "晨间简报", desc: "18 条世界模型 · 每日归档", url: "https://ndshuge.github.io/ndshuge-galaxy/daily-brief/", color: "#6aa8ff", glow: "#c9ddff", z: 8, moons: 3 }
];
/* ============ 引擎 ============ */
let W=480,H=270,CX=W/2,CY=H/2;
const FOCAL=12,TAU=Math.PI*2;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const IS_TOUCH=matchMedia('(pointer:coarse)').matches;
const cv=document.getElementById('space'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;
  if(f>=0){r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}else{r*=1+f;g*=1+f;b*=1+f}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);
  return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
let viewReady=false,sceneWidth=innerWidth,sceneHeight=innerHeight;
function fit(){
  sceneWidth=innerWidth;sceneHeight=Math.max(innerHeight,innerWidth<620?760:620);
  const scale=Math.max(1,Math.min(2,sceneWidth/480));
  W=Math.round(sceneWidth/scale);H=Math.round(sceneHeight/scale);CX=W/2;CY=H/2;
  cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
  cv.style.width=sceneWidth+'px';cv.style.height=sceneHeight+'px';
  document.body.style.minHeight=sceneHeight+'px';
  document.getElementById('hintTxt').textContent=sceneWidth<620?'拖动星空漫游 · 轻点星系进入':'拖动星空自由漫游 · 点击星系进入 · T 目的地 · / 终端 · R 总览';
  if(viewReady){layoutWorld();refreshBackdrop();resetView();syncLinks();}
}
addEventListener('resize',fit);fit();

function makeMoons(n,color){
  const rings=[.45,.68,.92],list=[];
  for(let i=0;i<n;i++){
    const ring=rings[i%rings.length];
    list.push({orbitR:ring,a:rnd(0,TAU),
      sp:rnd(.28,.5)*(i%2?1:-1)/(ring*2),
      mr:rnd(.05,.08),c:shade(color,i%2?-.15:.3)});}
  return list;}
function makeArms(){
  const pts=[];
  for(let arm=0;arm<2;arm++)for(let i=0;i<14;i++){
    const t2=i/13;
    pts.push({t:t2,off:arm*Math.PI+rnd(-.14,.14)});}
  return pts;}

/* ============ 总览与星团 ============
   默认八个入口完整可见。学习、创作游乐、现实日常按空间邻近分组。
   漫游是显式模式；普通指针移动只带来轻微背景视差。 */
const WX=[],WY=[];
const groupWorld=[];
let WWS=W,WHS=H;
// The atlas starts fully visible. Dragging either the stars or a destination label
// enters free flight, with direct pan, inertia, and a softly easing camera.
const M={vx:0,vy:0,driveX:0,driveY:0,targetX:0,targetY:0,
  inertiaX:0,inertiaY:0,zoom:1,dragging:false,mapA:1,mapOn:false,explore:false};
const systems=PROJECTS.map(function(p){
  return Object.assign({},p,{hx:CX,hy:CY,x:CX,y:CY,r:1,
    baseR:p.z/FOCAL*(23+(10-p.z)*.6),zEff:p.z,z0:p.z,_fade:1,
    armsN:(p.armsN||clamp(Math.round(12-p.z),2,6)),
    hover:0,shake:0,flash:0,floatPh:rnd(0,TAU),rotA:rnd(0,TAU),
    moons:makeMoons(p.moons||3,p.color),arms:makeArms()});});
let gdt=1/60,mouseX=CX,mouseY=CY,mox=0,moy=0,shakeT=0,whitePop=0,flameAcc=0,lastHover=null;
let focusedSystem=null,chartOpen=false;
const linkLayer=document.getElementById('destinations'),chart=document.getElementById('chart');
const destinationLinks=[];
[0,2,1,6,3,5,4,7].forEach(function(i){
  const p=systems[i];
  const a=document.createElement('a');a.className='destination';a.href=p.url;
  a.style.setProperty('--star-color',p.color);a.dataset.index=i;
  const name=document.createElement('span');name.className='destination-name';name.textContent=p.name;
  const desc=document.createElement('span');desc.className='destination-desc';desc.textContent=p.desc;
  a.append(name,desc);a.setAttribute('aria-label',p.name+'，'+p.desc);
  a.addEventListener('pointerenter',function(){focusedSystem=p;});
  a.addEventListener('pointerleave',function(){if(document.activeElement!==a)focusedSystem=null;});
  a.addEventListener('focus',function(){focusedSystem=p;});
  a.addEventListener('blur',function(){focusedSystem=null;});
  // Labels share the same gesture controller as the canvas: swipe = roam, tap = warp.
  a.addEventListener('pointerdown',function(e){startPan(e,a);});
  a.addEventListener('pointermove',function(e){movePan(e);});
  a.addEventListener('pointerup',function(e){finishPan(e);});
  a.addEventListener('pointercancel',function(e){cancelPan(e);});
  a.addEventListener('click',function(e){
    if(consumeDraggedLinkClick(e))return;
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    e.preventDefault();clickPlanet(p);
  });
  linkLayer.appendChild(a);destinationLinks[i]=a;
  const shortcut=document.createElement('a');shortcut.href=p.url;
  const label=document.createElement('span');label.textContent=p.name;
  const detail=document.createElement('small');detail.textContent=p.desc;
  shortcut.append(label,detail);
  shortcut.addEventListener('click',function(e){if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();clickPlanet(p);});
  chart.appendChild(shortcut);
});
function layoutWorld(){
  WWS=W;WHS=H;
  const mobile=sceneWidth<620;
  const points=mobile?
    [[.25,.25],[.24,.44],[.73,.28],[.51,.57],[.76,.73],[.25,.73],[.76,.44],[.51,.84]]:
    [[.18,.35],[.76,.34],[.29,.57],[.87,.56],[.38,.78],[.59,.79],[.64,.56],[.15,.79]];
  systems.forEach(function(p,i){const q=points[i]||[.5,.5];WX[i]=q[0]*W;WY[i]=Math.min(q[1]*H,(sceneHeight-(mobile?164:210))*H/sceneHeight);});
  const groups=mobile?[[.10,.16],[.10,.36],[.10,.65]]:[[.11,.24],[.64,.23],[.13,.68]];
  document.querySelectorAll('.constellation').forEach(function(el,i){
    const gy=(!mobile&&i===2)?(sceneHeight-300)/sceneHeight:groups[i][1];
    groupWorld[i]=[groups[i][0]*W,gy*H];
  });
}
function syncLinks(){
  const sx=sceneWidth/W,sy=sceneHeight/H;
  systems.forEach(function(p,i){
    const a=destinationLinks[i];
    const edge=sceneWidth<620?78:90;
    const left=clamp(p.x*sx,edge,sceneWidth-edge)+'px',top=((p.y+p.baseR*FOCAL/p.z0)*sy+6)+'px';
    if(a.style.left!==left)a.style.left=left;if(a.style.top!==top)a.style.top=top;
    const outside=p.x*sx<60||p.x*sx>sceneWidth-60||p.y*sy<120||((p.y+p.r)*sy+48)>sceneHeight-64;
    const b=minimapBox(),lx=parseFloat(left),ly=parseFloat(top);
    const overMap=M.mapOn&&lx+88>b.x*sx&&lx-88<(b.x+b.w)*sx&&ly<(b.y+b.h)*sy&&ly+52>b.y*sy;
    a.hidden=warp.active||(M.explore&&(outside||overMap));
  });
  // Group headings live in exactly the same camera space as their galaxies.
  // Never leave the grey labels pinned to the viewport when the stars move.
  document.querySelectorAll('.constellation').forEach(function(el,i){
    const g=groupWorld[i];if(!g)return;
    const x=((g[0]-CX)*M.zoom+CX-M.driveX)*sx;
    const y=((g[1]-CY)*M.zoom+CY-M.driveY)*sy;
    el.style.left=x+'px';el.style.top=y+'px';
    el.hidden=warp.active||(M.explore&&(x < -120||x > sceneWidth+20||y < (sceneWidth<620?150:145)||y > sceneHeight-70));
  });
}

function setStar(s,hx,hy,ze){if(warp.active&&s===warp.target)return;s.hx=hx;s.hy=hy;s.zEff=ze;s.z=ze;}
function updateView(dt,t){
  // Restore the original game's flight model: the ship follows the pointer
  // with a visible delay, and the camera trails at the original ~1.5 /sec.
  // Overview stays readable until the first real drag.
  const fly=M.explore;
  const zoomGoal=fly?1.48:1;
  M.zoom+=(zoomGoal-M.zoom)*Math.min(1,dt*(REDUCED?12:2.8));
  if(fly&&!M.dragging&&!REDUCED){
    M.targetX=clamp(M.targetX+M.inertiaX*dt,-W*.78,W*.78);
    M.targetY=clamp(M.targetY+M.inertiaY*dt,-H*.78,H*.78);
    const friction=Math.exp(-3.8*dt);
    M.inertiaX*=friction;M.inertiaY*=friction;
    if(Math.abs(M.inertiaX)<.5)M.inertiaX=0;
    if(Math.abs(M.inertiaY)<.5)M.inertiaY=0;
  }
  // Original steering: camera responds to pointer position instead of
  // snapping the whole image to each touch event.
  const steerX=fly?(clamp(mouseX,0,W)/W-.5)*W*.35:0;
  const steerY=fly?(clamp(mouseY,0,H)/H-.5)*H*.28:0;
  const camTx=fly?clamp(M.targetX+steerX,-W*.85,W*.85):0;
  const camTy=fly?clamp(M.targetY+steerY,-H*.85,H*.85):0;
  const c=REDUCED?1:Math.min(1,dt*1.5);
  M.driveX+=(camTx-M.driveX)*c;M.driveY+=(camTy-M.driveY)*c;
  const ppx=rocket.x,ppy=rocket.y;
  const rtx=fly?clamp(mouseX,20,W-20):CX;
  const rty=fly?clamp(mouseY,36,H-95):H*.48;
  const shipEase=REDUCED?1:Math.min(1,dt*1.2);
  rocket.x+=(rtx-rocket.x)*shipEase;
  rocket.y+=(rty-rocket.y)*shipEase;
  M.vx=(rocket.x-ppx)/Math.max(dt,.0001);
  M.vy=(rocket.y-ppy)/Math.max(dt,.0001);
  // Match the original -0.22 parallax instead of v1.8.1's almost static -0.055.
  mox=REDUCED?0:-M.driveX*.22;
  moy=REDUCED?0:-M.driveY*.22;
  systems.forEach(function(p,i){
    setStar(p,(WX[i]-CX)*M.zoom+CX-M.driveX,(WY[i]-CY)*M.zoom+CY-M.driveY,p.z0);
  });
}
function resetView(){

}

let actx=null,master=null,muted=false;
function audio(){if(actx)return;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=muted?0:1;master.connect(actx.destination);
    setInterval(arp,560);}catch(e){}}
function env(g,t0,a,d,peak){g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(peak,t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);}
function tone(type,f0,f1,dur,peak,delay){if(!actx||!master)return;
  const t=actx.currentTime+(delay||0);
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  env(g,t,.005,dur,peak);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function noiseS(dur,peak,f0,f1,Q){if(!actx||!master)return;
  const n=Math.max(1,(actx.sampleRate*dur)|0),buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=actx.createBufferSource();s.buffer=buf;
  const f=actx.createBiquadFilter();f.type='bandpass';f.Q.value=Q||.8;
  f.frequency.setValueAtTime(f0,actx.currentTime);
  f.frequency.exponentialRampToValueAtTime(Math.max(60,f1),actx.currentTime+dur);
  const g=actx.createGain();env(g,actx.currentTime,.004,dur,peak);
  s.connect(f);f.connect(g);g.connect(master);s.start();}
function arp(){if(!actx||muted)return;if(Math.random()<.55)return;
  const sc=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];
  const f=sc[(Math.random()*sc.length)|0];
  tone('triangle',f,f,1.4,.035);tone('sine',f/2,f/2,1.6,.02);}

let pressPoint=null,lastDraggedLink=null,draggedLinkUntil=0;
function eventTime(e){return Number.isFinite(e.timeStamp)?e.timeStamp:performance.now();}
function startPan(e,owner){
  if(warp.active||pressPoint||(e.button!==undefined&&e.button!==0))return;
  lastDraggedLink=null;
  const p=toGame(e);mouseX=p[0];mouseY=p[1];
  pressPoint={id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,
    lastTime:eventTime(e),dragged:false,owner:owner};
  if(owner.setPointerCapture)owner.setPointerCapture(e.pointerId);
}
function movePan(e){
  const p=toGame(e);mouseX=p[0];mouseY=p[1];
  const press=pressPoint;
  if(!press||press.id!==e.pointerId)return;
  const total=Math.hypot(e.clientX-press.x,e.clientY-press.y);
  if(!press.dragged&&total<=7)return;
  if(!press.dragged){press.dragged=true;setExplore(true);setChart(false);
    M.dragging=true;M.inertiaX=0;M.inertiaY=0;
    document.body.classList.add('dragging');}
  const dx=clamp(e.clientX-press.lastX,-120,120)*W/sceneWidth;
  const dy=clamp(e.clientY-press.lastY,-120,120)*H/sceneHeight;
  const elapsed=clamp((eventTime(e)-press.lastTime)/1000,.012,.08);
  M.targetX=clamp(M.targetX-dx*.62,-W*.78,W*.78);
  M.targetY=clamp(M.targetY-dy*.62,-H*.78,H*.78);
  // Direct motion under the pointer, followed by a short damped coast on release.
  // Keep the camera behind the ship, not locked to the finger.
  // The original fly-through was smooth, not a 1:1 image drag.
  if(Math.hypot(dx,dy)>.1){
    M.inertiaX=clamp(-dx/elapsed*.20,-W*.8,W*.8);
    M.inertiaY=clamp(-dy/elapsed*.20,-H*.8,H*.8);
  }
  press.lastX=e.clientX;press.lastY=e.clientY;press.lastTime=eventTime(e);
  if(e.cancelable&&e.preventDefault)e.preventDefault();
}
function finishPan(e){
  if(!pressPoint||pressPoint.id!==e.pointerId)return null;
  movePan(e);
  const press=pressPoint;pressPoint=null;
  if(press.dragged&&press.owner!==cv){lastDraggedLink=press.owner;
    draggedLinkUntil=performance.now()+600;}
  M.dragging=false;document.body.classList.remove('dragging');
  if(REDUCED||!press.dragged){M.inertiaX=0;M.inertiaY=0;}
  return press;
}

  pressPoint=null;M.dragging=false;M.inertiaX=0;M.inertiaY=0;

/* ============ 主循环 ============ */
function update(dt,t){
  gdt=dt;
  if(rocket.intro<1)rocket.intro=Math.min(1,rocket.intro+dt/1.3);
  rocket.hop=Math.max(0,rocket.hop-dt*2.4);
  rocket.tilt=clamp(-M.vx*0.05,-10,10);
  updateView(dt,t);
  if(warp.active){warp.t=Math.min(1,warp.t+dt/(warp.gentle?1:1.35));
    warp.k=warp.t*warp.t*(3-2*warp.t);
    if(!flash.active){const zEnd=warp.gentle?.5:.32;
      const tz=lerp(warp.target.z,zEnd,warp.k);
      if(warp.target.baseR*FOCAL/tz>=(warp.gentle?210:300)){
        flash.active=true;flash.gentle=warp.gentle;flash.t=.8;}}}
  if(flash.active){flash.t-=dt;
    if(flash.t<=0){flash.active=false;location.href=warp.url;return;}}
  for(let i=0;i<systems.length;i++){const s=systems[i];
    if(warp.active&&s===warp.target)s.zEff=lerp(s.z,warp.gentle?.5:.32,warp.k);
    s.r=s.baseR*FOCAL/s.zEff*(1+.06*s.hover);
    s.fade=(warp.active&&s!==warp.target)?1-warp.k:(s._fade===undefined?1:s._fade);
    let x=s.hx,y=s.hy;
    if(!REDUCED&&M.explore)y+=Math.sin(t*.6+s.floatPh)*.6;
    if(warp.active){const k=warp.k;
      if(s===warp.target){x+=(CX-x)*k;y+=(CY-y)*k;}
      else if(!warp.gentle){x+=(x-CX)*k*1.35;y+=(y-CY)*k*1.35;}}
    if(s.shake>0){s.shake=Math.max(0,s.shake-dt*2.2);x+=Math.sin(t*60)*3.5*s.shake;}
    if(s.flash>0)s.flash=Math.max(0,s.flash-dt*3.5);
    s.x=x;s.y=y;
    const spinUp=(warp.active&&s===warp.target)?Math.max(.2,1-warp.k*1.2):1;
    s.rotA+=.06*gdt*spinUp*(REDUCED?.3:1);
    for(let j=0;j<s.moons.length;j++){const m=s.moons[j];
      m.a+=m.sp*gdt*spinUp*(REDUCED?.3:1);}}
  for(let i=0;i<rocks.length;i++){const rk=rocks[i];rk.a+=rk.sp*dt*(REDUCED?.3:1);}
  if(warp.active&&!warp.gentle){for(let i=0;i<wstars.length;i++){const ws=wstars[i];
    ws.d+=ws.sp*gdt*(1+warp.k*2.5);
    if(ws.d>320){ws.d=rnd(2,14);ws.a=rnd(0,TAU);ws.px=-999;ws.py=-999;}}}
  let hp=null;
  M.mapA=1;
  if(!warp.active){hp=focusedSystem;
    if(!hp){const sorted=systems.slice().sort(function(a,b){return a.zEff-b.zEff;});
      for(let i=0;i<sorted.length;i++){const q=sorted[i];if(Math.hypot(mouseX-q.x,mouseY-q.y)<=q.r){hp=q;break;}}}}
  if(hp&&hp!==lastHover)SND.hover();
  lastHover=hp;
  cv.style.cursor=hp?'pointer':'default';
  for(let i=0;i<systems.length;i++){const s=systems[i];
    s.hover+=((s===hp?1:0)-s.hover)*Math.min(1,dt*9);}
  const flyBoost=rocket.flying?(1+clamp((warp.t-.38)/.62,0,1)*14):0;
  const shipSpeed=clamp(Math.hypot(M.vx,M.vy)/140,0,1.4);
  const fb=(warp.active&&!warp.gentle)?(4+warp.k*4+flyBoost):((REDUCED?.5:1)+(rocket.intro<1?2.2:0)+shipSpeed);
  flameAcc+=dt*26*fb;
  while(flameAcc>=1){flameAcc--;
    if(parts.length<420)parts.push({x:rocket.x+rnd(-2,2),y:rocket._y+9,
      vx:rnd(-7,7),vy:rnd(26,50)*((warp.active&&!warp.gentle)?1.5:1),age:0,life:rnd(.22,.5),
      s:Math.random()<.35?2:1,
      c:Math.random()<.45?'#ffd54f':(Math.random()<.6?'#ffffff':'#ff4757')});}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];
    q.age+=dt;if(q.age>=q.life){parts.splice(i,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=1-1.4*dt;q.vy*=1-1.4*dt;}
  syncLinks();
  rocket.salute=Math.max(0,rocket.salute-dt);
  shakeT=Math.max(0,shakeT-dt);whitePop=Math.max(0,whitePop-dt);
}

function drawStars(t,boost){
  for(let i=0;i<stars.length;i++){const s=stars[i];
    s.d+=s.sp*boost*gdt;
    if(s.d>320){s.d=rnd(1,18);s.a=rnd(0,TAU);s.px=-999;s.py=-999;}
    const x=CX+Math.cos(s.a)*s.d+mox*s.par,y=CY+Math.sin(s.a)*s.d*.78+moy*s.par;
    const a=warp.active?.55:(REDUCED?.6:(.3+.7*Math.pow(Math.sin(t*s.tw+s.ph)*.5+.5,2)));
    const dx=x-s.px,dy=y-s.py;
    ctx.globalAlpha=a;ctx.fillStyle=s.c;ctx.strokeStyle=s.c;
    if(boost>3&&dx*dx+dy*dy>9){ctx.lineWidth=s.s;ctx.beginPath();ctx.moveTo(s.px,s.py);ctx.lineTo(x,y);ctx.stroke();}
    else ctx.fillRect(x|0,y|0,s.s,s.s);
    s.px=x;s.py=y;}
  ctx.globalAlpha=1;
}
function drawRocks(){
  ctx.fillStyle='rgba(178,190,210,.45)';
  for(let i=0;i<rocks.length;i++){const rk=rocks[i];
    const x=(CX+Math.cos(rk.a)*rk.rx+mox*.25)|0,y=(CY+Math.sin(rk.a)*rk.ry+moy*.2)|0;
    ctx.fillRect(x,y,rk.s,rk.s);}
}
/* 迷你星系：两条主旋臂的对数螺旋，臂点按弧长连续（步长约 1px），
   盘面散星与核球刻意压暗压小，把对比度全部让给旋臂。 */
function drawSystem(s,t){
  if(s.zEff>60||s.r<.5)return;
  const F=(s.fade===undefined)?1:s.fade;
  if(F<.03)return;
  const x=s.x|0,y=s.y|0,r=Math.max(1,s.r);
  const near=clamp((12-s.zEff)/6,.25,1);
  const breath=.5+.5*Math.sin(t*2+s.floatPh);
  const hoverK=s.hover*(REDUCED?.6:(.55+.45*breath));
  let seed=((s.floatPh*7919)^((s.z0||8)*131)^0x9e37)|0;seed=seed>>>0;
  const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
  const sq=.60+.14*rnd();
  const k=.38+.10*rnd();
  const dir=rnd()<.5?-1:1;
  const NA=clamp(s.armsN||2,2,6);
  const dim=Math.pow(2/NA,.35);
  /* 1) 盘面雾底：压扁椭圆，很淡 */
  ctx.save();ctx.translate(x,y);ctx.scale(1,sq);
  const ng=ctx.createRadialGradient(0,0,0,0,0,r);
  ng.addColorStop(0,hexA(s.color,.09*near+.04*hoverK));
  ng.addColorStop(.6,hexA(s.color,.032*near));
  ng.addColorStop(1,hexA(s.color,0));
  ctx.globalAlpha=F;ctx.fillStyle=ng;
  ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
  ctx.restore();
  /* 2) 盘面散星：只做底噪 */
  const discN=Math.max(9,(r*0.85)|0);
  for(let i=0;i<discN;i++){
    const rr=r*(.20+.80*Math.sqrt(rnd()));
    const aa=rnd()*TAU;
    ctx.globalAlpha=((.10*(1-rr/r)+.02)*near*(1+.5*hoverK))*F;
    ctx.fillStyle=rr<r*.3?s.glow:s.color;
    ctx.fillRect((x+Math.cos(aa)*rr)|0,(y+Math.sin(aa)*rr*sq)|0,1,1);
  }
  /* 3) 两条主旋臂：对数螺旋，弧长步进保证连线不断 */
  const R=r*.98,R0=r*(.18+(NA-2)*.022);
  const thMax=Math.log(R/R0)/k;
  const bwBase=r>58?3:(r>28?2:1);
  const bw=NA>=5?Math.max(1,bwBase-1):bwBase;
  for(let arm=0;arm<NA;arm++){
    const off=arm*TAU/NA;
    let th=0;
    while(th<thMax){
      const rr=R0*Math.exp(k*th);
      const ang=dir*th+off+s.rotA;
      const px=x+Math.cos(ang)*rr,py=y+Math.sin(ang)*rr*sq;
      const u=rr/R;
      const aa=(u<.4?(.95-.35*u):(.85*(1-u)+.25))*near*(1+.45*hoverK)*F*dim;
      const knot=(Math.abs(u-.36)<.045||Math.abs(u-.70)<.045);
      ctx.globalAlpha=clamp(knot?aa*1.5:aa,0,1);
      ctx.fillStyle=u<.4?s.glow:s.color;
      ctx.fillRect(px|0,py|0,bw,bw);
      if(rnd()<.40*dim){
        const pa=ang+Math.PI/2;
        const sp=(rnd()-.5)*r*.24*(1.15-u);
        ctx.globalAlpha=clamp(aa*.5,0,1);
        ctx.fillRect((x+Math.cos(ang)*rr+Math.cos(pa)*sp)|0,
                     (y+Math.sin(ang)*rr*sq+Math.sin(pa)*sp*sq)|0,1,1);
      }
      th+=1/Math.max(2.2,rr);
    }
  }
  /* 3b) 盘面亮星：随盘面缓慢漂移的高亮点 */
  for(let i=0;i<s.moons.length;i++){const m=s.moons[i];
    const aa=m.a*0.55+s.rotA*1.4;
    const rr=r*(0.34+m.orbitR*0.55);
    ctx.globalAlpha=clamp((.50+.35*hoverK)*near,0,1)*F;
    ctx.fillStyle=s.glow;
    ctx.fillRect((x+Math.cos(aa)*rr)|0,(y+Math.sin(aa)*rr*sq)|0,1,1);}
  /* 4) 核球：小而亮，不吞内臂 */
  const cr=r*.17*(1+.07*breath+.10*hoverK);
  ctx.save();ctx.translate(x,y);ctx.scale(1,sq);
  const g=ctx.createRadialGradient(0,0,0,0,0,cr*2.2);
  g.addColorStop(0,'#ffffff');
  g.addColorStop(.28,s.color);
  g.addColorStop(1,hexA(s.color,0));
  ctx.globalAlpha=clamp(.88+.12*near+.15*hoverK,0,1)*F;
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,cr*2.2,0,TAU);ctx.fill();
  ctx.restore();
  /* 名称由真实HTML链接承载，保证触控、键盘和文字可读性。 */
  if(s.flash>0){ctx.globalAlpha=s.flash*.85*F;ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.globalAlpha=1;}
  ctx.globalAlpha=1;
}
function drawRocket(t){
  const ie=1-Math.pow(1-rocket.intro,3);
  const introY=(1-ie)*124;
  const bob=Math.sin(t*2.1)*1.6;
  const drift=Math.sin(t*.6)*2.5;
  const jit=(warp.active&&!warp.gentle)?rnd(-.8,.8):0;
  const hopY=rocket.hop>0?-Math.sin((1-rocket.hop)*Math.PI)*3.2:0;
  const x=(rocket.x+drift+rocket.tilt+jit)|0;
  const y=(rocket.y+bob+introY+hopY+(rocket.flyY||0)+jit*.5)|0;
  rocket._y=y;
  ctx.strokeStyle='rgba(207,216,220,.85)';ctx.lineWidth=1;
  const tw=Math.sin(t*3.2)*2;
  ctx.beginPath();ctx.moveTo(x+6,y-1);ctx.quadraticCurveTo(x+13+tw,y+3,x+11+tw*.6,y+9);ctx.stroke();
  const fl=6+Math.sin(t*31)*1.5+(rocket.intro<1?5:0)+((warp.active&&!warp.gentle)?8+(rocket.flying?6:0):0);
  ctx.fillStyle='#ffd54f';ctx.fillRect(x-2,y+6,4,3);
  ctx.fillStyle='rgba(255,213,79,.55)';ctx.fillRect(x-1,y+9,2,fl|0);
  ctx.fillStyle='#ffffff';ctx.fillRect(x-1,y+6,2,2);
  ctx.fillStyle='#ff4757';ctx.fillRect(x-8,y-3,3,9);ctx.fillRect(x+5,y-3,3,9);
  ctx.fillStyle='#cfd8dc';ctx.fillRect(x-5,y-14,10,18);
  ctx.fillStyle='#ffffff';ctx.fillRect(x+1,y-14,2,18);
  ctx.fillStyle='rgba(10,25,60,.25)';ctx.fillRect(x-5,y-14,2,18);
  ctx.fillStyle='#ff4757';
  ctx.fillRect(x-1,y-18,2,2);ctx.fillRect(x-3,y-16,6,2);ctx.fillRect(x-5,y-14,10,2);
  ctx.fillRect(x-5,y+1,10,2);
  ctx.fillStyle='rgba(10,25,60,.55)';ctx.fillRect(x-3,y+4,6,3);
  const look=Math.sin(t*.55)*.9;
  const blink=(t%3.4)<.14;
  const wx=x+look,wy=y-7;
  ctx.fillStyle='#08122e';ctx.beginPath();ctx.arc(wx,wy,4.5,0,TAU);ctx.fill();
  ctx.fillStyle='#cfd8dc';ctx.beginPath();ctx.arc(wx,wy+1.2,2.6,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(wx-1.7,wy-1,1.2,0,TAU);ctx.arc(wx+1.7,wy-1,1.2,0,TAU);ctx.fill();
  ctx.fillStyle='#ff9ec4';
  ctx.beginPath();ctx.arc(wx-1.7,wy-1,.6,0,TAU);ctx.arc(wx+1.7,wy-1,.6,0,TAU);ctx.fill();
  ctx.fillStyle='#08122e';
  if(blink)ctx.fillRect((wx-1.5)|0,(wy+.7)|0,3,1);
  else{ctx.fillRect((wx-1.5)|0,(wy+.6)|0,1,1);ctx.fillRect((wx+.6)|0,(wy+.6)|0,1,1);}
  ctx.strokeStyle='#00e5ff';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(wx,wy,4.5,0,TAU);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(wx-3,wy-3,1,1);
  if(rocket.salute>0){ctx.fillStyle='#cfd8dc';ctx.fillRect(x+5,y-16,2,7);
    ctx.fillStyle='#ffffff';ctx.fillRect(x+5,y-18,2,2);
    const tw2=Math.sin(t*12)*.5+.5;
    ctx.globalAlpha=.35+.65*tw2;ctx.fillStyle='#ffd54f';
    ctx.fillRect(x-5,y-26,1,1);ctx.fillRect(x+5,y-24,1,1);ctx.globalAlpha=1;}
}
function drawParts(){
  for(let i=0;i<parts.length;i++){const q=parts[i];const a=1-q.age/q.life;
    ctx.globalAlpha=a;ctx.fillStyle=q.c;
    const s=Math.max(1,(q.s*(0.6+a*0.4))|0);
    ctx.fillRect(q.x|0,q.y|0,s,s);}
  ctx.globalAlpha=1;
}
/* 屏幕外的星系：在画面边缘闪烁提示方向 */
function drawOffscreen(t){
  for(let i=0;i<systems.length;i++){const s=systems[i];
    if(s.x>16&&s.x<W-16&&s.y>16&&s.y<H-16)continue;
    const px=clamp(s.x,12,W-12)|0,py=clamp(s.y,12,H-12)|0;
    const p=.35+.65*Math.abs(Math.sin(t*1.8+i));
    ctx.globalAlpha=p;ctx.fillStyle=s.color;
    const bx=s.x<12?-1:(s.x>W-12?1:0);
    const by=s.y<12?-1:(s.y>H-12?1:0);
    if(bx===-1)ctx.fillRect(px-1,py-3,4,6);
    else if(bx===1)ctx.fillRect(px-3,py-3,4,6);
    else ctx.fillRect(px-3,py-1,6,4);
    if(bx&&by)ctx.fillRect(px-1,py-1,2,2);
  }
  ctx.globalAlpha=1;
}
/* 航向准星：画在鼠标处，中心留出断口 */
function drawHelm(t){
  const hx=clamp(mouseX,0,W)|0,hy=clamp(mouseY,0,H)|0;
  ctx.strokeStyle='#00e5ff';ctx.lineWidth=1;
  ctx.globalAlpha=.62;
  ctx.beginPath();ctx.moveTo(hx-7,hy);ctx.lineTo(hx-2,hy);
  ctx.moveTo(hx+2,hy);ctx.lineTo(hx+7,hy);
  ctx.moveTo(hx,hy-7);ctx.lineTo(hx,hy-2);
  ctx.moveTo(hx,hy+2);ctx.lineTo(hx,hy+7);ctx.stroke();
  ctx.globalAlpha=.3;ctx.beginPath();ctx.arc(hx,hy,10,0,TAU);ctx.stroke();
  ctx.globalAlpha=.18;ctx.beginPath();ctx.arc(hx,hy,2,0,TAU);ctx.stroke();
  ctx.globalAlpha=1;
}
/* 漫游时的小地图：标签位置一次保存，绘制和点击共用同一映射。 */
function minimapBox(){return{x:W-170,y:66,w:158,h:104};}
function drawMinimap(t){
  if(!M.mapOn)return;
  const b=minimapBox(),labels=[];
  ctx.fillStyle='rgba(4,8,24,.9)';ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.strokeStyle='rgba(110,180,220,.4)';ctx.strokeRect(b.x+.5,b.y+.5,b.w,b.h);
  ctx.font='8px "Fusion Pixel 12px Mono",monospace';ctx.textAlign='left';
  systems.forEach(function(s,i){
    const x=b.x+6+WX[i]/WWS*(b.w-12),y=b.y+8+WY[i]/WHS*(b.h-16);
    ctx.fillStyle=s.color;ctx.fillRect(x-1,y-1,3,3);
    const width=ctx.measureText(s.name).width;
    const candidates=[[x+5,y-3],[x-width-5,y-3],[x-width/2,y+11],[x-width/2,y-10]];
    let label=null;
    for(const q of candidates){const r={x:q[0],y:q[1]-7,w:width,h:9};
      if(r.x<b.x+2||r.x+r.w>b.x+b.w-2||r.y<b.y+2||r.y+r.h>b.y+b.h-2)continue;
      if(labels.some(function(a){return r.x<a.x+a.w+2&&r.x+r.w+2>a.x&&r.y<a.y+a.h+2&&r.y+r.h+2>a.y;}))continue;
      label=r;break;}
    if(label){labels.push(label);ctx.fillStyle='#d8e7f5';ctx.fillText(s.name,label.x,label.y+7);}
  });
  ctx.fillStyle='#b7d5e5';ctx.fillText('星图 · 点选目的地',b.x,b.y-7);ctx.globalAlpha=1;
}

function render(t){
  ctx.setTransform(1,0,0,1,0,0);
  if(shakeT>0)ctx.translate(rnd(-3,3)*shakeT*2,rnd(-3,3)*shakeT*2);
  if(warp.active&&!warp.gentle){const z=1+warp.k*.05;
    ctx.translate(CX,CY);ctx.scale(z,z);ctx.translate(-CX,-CY);}
  ctx.fillStyle=bgGrad;ctx.fillRect(-8,-8,W+16,H+16);
  for(let i=0;i<nebula.length;i++){ctx.fillStyle=nebula[i];ctx.fillRect(0,0,W,H);}
  ctx.save();ctx.translate(CX,CY);ctx.rotate(-.28);
  const mg=ctx.createRadialGradient(0,0,10,0,0,240);
  mg.addColorStop(0,'rgba(140,170,255,.05)');mg.addColorStop(1,'rgba(140,170,255,0)');
  ctx.fillStyle=mg;ctx.fillRect(-260,-52,520,104);ctx.restore();
  const boost=REDUCED?0:1;
  drawStars(t,boost);
  for(let i=0;i<band.length;i++){const b2=band[i];
    ctx.globalAlpha=b2.a*(REDUCED?.8:(.7+.3*Math.sin(t*.8+i)));
    ctx.fillStyle='#cfd8ff';ctx.fillRect((b2.x+mox*.15)|0,(b2.y+moy*.1)|0,1,1);}
  ctx.globalAlpha=1;
  drawRocks();
  for(let i=0;i<brights.length;i++){const b3=brights[i];
    const tw3=REDUCED?.6:(.5+.5*Math.sin(t*1.6+b3.ph));
    const bx=(b3.x+mox*.2)|0,by=(b3.y+moy*.15)|0;
    ctx.globalAlpha=.5+.4*tw3;ctx.fillStyle='#ffffff';
    ctx.fillRect(bx-1,by-1,2,2);
    ctx.globalAlpha=.3*tw3;
    ctx.fillRect(bx-4,by,3,1);ctx.fillRect(bx+2,by,3,1);
    ctx.fillRect(bx,by-4,1,3);ctx.fillRect(bx,by+2,1,3);}
  ctx.globalAlpha=1;
  const sorted=systems.slice().sort(function(a,b){return b.zEff-a.zEff;});
  for(let i=0;i<sorted.length;i++)drawSystem(sorted[i],t);
  drawRocket(t);
  drawParts();
  drawOffscreen(t);
  drawMinimap(t);if(M.explore&&!IS_TOUCH&&!REDUCED)drawHelm(t);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
  if(whitePop>0){ctx.fillStyle='rgba(255,255,255,'+(whitePop/.12*.5)+')';ctx.fillRect(0,0,W,H);}
  if(flash.active){var bd=flash.gentle?.45:.5;
    ctx.fillStyle='rgba(2,3,10,'+(clamp(1-flash.t/bd,0,1))+')';ctx.fillRect(0,0,W,H);}
}
let last=performance.now();
function frame(now){const dt=clamp((now-last)/1000,0,.05);last=now;
  update(dt,now/1000);render(now/1000);requestAnimationFrame(frame);}
layoutWorld();resetView();viewReady=true;syncLinks();
requestAnimationFrame(frame);
window.__gx=function(){return{
  stars:systems.map(function(s){return{name:s.name,x:Math.round(s.x),y:Math.round(s.y),r:Math.round(s.r),arms:s.armsN};}),
  cam:[Math.round(M.driveX),Math.round(M.driveY)],map:M.mapOn,explore:M.explore,muted:muted,
  viewport:[W,H],destinations:destinationLinks.length,warpActive:warp.active,
  visits:visits,parts:parts.length,title:document.getElementById('titleText').textContent};};
</script>
</body>
</html>
