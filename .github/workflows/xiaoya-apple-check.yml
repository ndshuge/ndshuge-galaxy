name: XiaoYa Apple release guard
on:
  push:
    paths:
      - "little-works/xiaoya-apple/**"
      - "little-works/index.html"
      - "little-works/catalog.json"
      - "qa-apple-next.cjs"
      - "qa-xiaoya-apple-static.cjs"
      - ".github/workflows/xiaoya-apple-check.yml"
  pull_request:
    paths:
      - "little-works/xiaoya-apple/**"
      - "little-works/index.html"
      - "little-works/catalog.json"
      - "qa-apple-next.cjs"
      - "qa-xiaoya-apple-static.cjs"
      - ".github/workflows/xiaoya-apple-check.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify Apple source and optics
        run: node qa-xiaoya-apple-static.cjs
      - name: Verify the release guard actually rejects a false Safari claim
        shell: bash
        run: |
          if SKILL_GATE_NEGATIVE_TEST=unsupported-safari node qa-xiaoya-apple-static.cjs; then
            echo 'FAIL: unsupported Safari claim passed the existing gate'
            exit 1
          fi
          echo 'PASS: false Safari claim blocked as expected'
          if SKILL_GATE_NEGATIVE_TEST=missing-skill-evidence node qa-xiaoya-apple-static.cjs; then
            echo 'FAIL: missing Skill evidence passed the existing gate'
            exit 1
          fi
          echo 'PASS: missing Skill evidence blocked as expected'
          if SKILL_GATE_NEGATIVE_TEST=missing-corner-system node qa-xiaoya-apple-static.cjs; then
            echo 'FAIL: removed Apple radius system passed the existing gate'
            exit 1
          fi
          echo 'PASS: missing Apple corner system blocked as expected'
          if SKILL_GATE_NEGATIVE_TEST=missing-webkit-optics node qa-xiaoya-apple-static.cjs; then
            echo 'FAIL: missing WebKit optical engine passed the existing gate'
            exit 1
          fi
          echo 'PASS: missing WebKit content optics blocked as expected'
          if SKILL_GATE_NEGATIVE_TEST=missing-webkit-refraction node qa-xiaoya-apple-static.cjs; then
            echo 'FAIL: missing WebKit optical copy passed the existing gate'
            exit 1
          fi
          echo 'PASS: missing WebKit optical copy blocked as expected'
      - name: Install pinned browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.64.0
          npx playwright install --with-deps chromium webkit
      - name: Browser QA — Chromium and real Playwright WebKit
        env:
          XIAOYA_BROWSER_CHANNEL: chromium
          XIAOYA_REQUIRE_WEBKIT: "1"
        run: |
          python3 -m http.server 5393 --bind 127.0.0.1 > /tmp/xiaoya-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5393/little-works/xiaoya-apple/ >/dev/null; then break; fi
            sleep 1
          done
          node qa-apple-next.cjs
      - name: Check JavaScript parse
        run: |
          node --check little-works/xiaoya-apple/apple-next.js
          node --check little-works/xiaoya-apple/glass/liquid-glass.js
